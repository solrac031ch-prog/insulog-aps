name: Clinical r2 visual baseline recorder

on:
  push:
    branches: [clinical-alignment-r2]

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Align visual flow copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/e2e/visual-contract.spec.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('toContainText("Nuevo Esquema sugerido")', 'toContainText("Nuevo esquema sugerido")')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Record visual hashes
        run: |
          set -o pipefail
          VISUAL_RECORD=1 npx playwright test tests/e2e/visual-contract.spec.js --project=chromium | tee /tmp/visual.log
      - name: Update baseline JSON
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          log = Path('/tmp/visual.log').read_text(encoding='utf-8')
          pairs = re.findall(r'VISUAL_BASELINE\s+(\S+)\s+([0-9a-f]+)', log)
          if not pairs:
              raise SystemExit('No visual hashes recorded')
          p = Path('tests/e2e/visual-baseline.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          for key, value in pairs:
              if key not in data['profiles']:
                  data['profiles'][key] = {'hash': value}
              else:
                  data['profiles'][key]['hash'] = value
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Updated {len(pairs)} visual hashes')
          PY
      - name: Commit updated clinical visual contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual-contract.spec.js tests/e2e/visual-baseline.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Clinical r2: actualizar contrato visual"
          git push
