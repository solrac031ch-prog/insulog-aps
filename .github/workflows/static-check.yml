name: Insulog static checks

on:
  push:
    branches: [main, optimize-app-2026-08, optimize-pdf-glucose-log, update-aps-safety-ada2026, emergency-recover-stable, disable-sw-interception, atomic-app-shell-cache, static-treatment-followup-page, hypoglycemia-alert-on-demand, hide-hypo-alert-by-default, hypoglycemia-check-after-entry, refresh-shell-without-slow-start, inicio-treatment-page-a1c-efficacy, med-dose-safety-ada2026, clean-formulary-combination-rules, allow-vildamet-with-metformin, clean-medication-copy-empa10, patient-friendly-pdf-schedules]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check pdf-enhancements.js
          node --check aps-safety-2026.js
          node --check sw.js

      - name: Validate manifest JSON
        run: python -m json.tool manifest.webmanifest > /dev/null

      - name: Validate essential application structure
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          pdf_js = Path("pdf-enhancements.js").read_text(encoding="utf-8")
          pdf_css = Path("pdf-enhancements.css").read_text(encoding="utf-8")
          aps_js = Path("aps-safety-2026.js").read_text(encoding="utf-8")
          aps_css = Path("aps-safety-2026.css").read_text(encoding="utf-8")
          sw = Path("sw.js").read_text(encoding="utf-8")

          required_ids = [
              "p0", "p1", "p2", "p3", "p35", "p4", "p41", "p5", "p6",
              "tratamiento-concomitante-seguimiento", "alerta-hipoglicemia-ada",
              "hipo-ada-titulo", "hipo-ada-descripcion", "hipo-sin-ayuda", "hipo-con-ayuda",
              "ajustar-seguimiento-btn", "peso-paciente", "factor-dosis", "peso-seguimiento",
              "tabla-seguimiento", "nota-clinica", "pdf"
          ]
          missing = [item for item in required_ids if f'id="{item}"' not in html]
          if missing:
              raise SystemExit(f"Missing required IDs: {missing}")

          if len(re.findall(r"<head(?:\s|>)", html, re.I)) != 1 or len(re.findall(r"</head>", html, re.I)) != 1:
              raise SystemExit("index.html must contain exactly one head")

          required_html_assets = [
              './app.js?v=20260826',
              './pdf-enhancements.js?v=20260827-3',
              './aps-safety-2026.js?v=20260827-2',
              './pdf-enhancements.css?v=20260827-3',
              './aps-safety-2026.css?v=20260827-2'
          ]
          for asset in required_html_assets:
              if asset not in html:
                  raise SystemExit(f"Direct application asset is not loaded: {asset}")

          script_order = [
              html.index('./app.js?v=20260826'),
              html.index('./pdf-enhancements.js?v=20260827-3'),
              html.index('./aps-safety-2026.js?v=20260827-2')
          ]
          if script_order != sorted(script_order):
              raise SystemExit("JavaScript load order must be app -> PDF -> APS safety")

          if 'class="aps-safety-box is-hidden"' not in html:
              raise SystemExit("Hypoglycemia review must be hidden directly in HTML")
          if html.index('id="alerta-hipoglicemia-ada"') <= html.index('id="ajustar-seguimiento-btn"'):
              raise SystemExit("Hypoglycemia review must appear after the final Adjust button")

          for required_text in [
              "Preonce / Precena", "col-hora-medicion", "col-hgt",
              "PAUTAS_PACIENTE", "actualizarDosisInsulinaPaciente", "actualizarTratamientoPaciente",
              "Dosis AM:", "antes del desayuno", "Dosis PM:", "antes de dormir",
              "Medicamentos para la diabetes", "comprimido", "queueMicrotask"
          ]:
              if required_text not in pdf_js:
                  raise SystemExit(f"Patient PDF layer is missing: {required_text}")

          for patient_med in [
              "Metformina 850 mg: 1 comprimido", "Metformina XR 1.000 mg: 1 comprimido",
              "Dapagliflozina 10 mg: 1 comprimido en la mañana",
              "Empagliflozina 10 mg: 1 comprimido en la mañana",
              "Vildagliptina 50 mg: 1 comprimido en la mañana",
              "Vildagliptina/metformina 50/500 mg: 1 comprimido con el desayuno"
          ]:
              if patient_med not in pdf_js:
                  raise SystemExit(f"Patient medication schedule is missing: {patient_med}")

          for forbidden_text in ["actualizarAlertaHipoglicemia", 'addEventListener("input"', 'createElement("script")']:
              if forbidden_text in pdf_js:
                  raise SystemExit(f"PDF layer contains unrelated runtime logic: {forbidden_text}")
          if "#p4 > .aps-safety-box" in pdf_css or "hypo-visible" in pdf_css:
              raise SystemExit("PDF stylesheet must not control clinical safety visibility")

          for required_text in [
              "sobreinsulinización", "HIPOGLICEMIA NIVEL 3", "Promedio capilar global del registro",
              "evaluarHipoglicemiaADA", "firmaRegistroGlicemias", "mostrarRevisionHipoglicemia",
              "resolverRevisionHipoglicemia", "revisionHipo", "hipo-sin-ayuda", "hipo-con-ayuda",
              "insertarPaginaTratamientoInicio", 'page.id = "p25"', "definirEsquemaInicioConTratamiento",
              "enriquecerTratamientoSeguimiento", "NOTA_EFICACIA", "activarSelectoresDosis",
              "sincronizarSelectorDosis", "Precauciones / evitar"
          ]:
              if required_text not in aps_js:
                  raise SystemExit(f"APS safety layer is missing: {required_text}")

          if 'addEventListener("input"' in aps_js or '.glicemia")) actualizar' in aps_js:
              raise SystemExit("Hypoglycemia review must not react while glucose values are being typed")

          for required_text in [
              "Metformina 500 mg", "Metformina 750 mg", "Metformina 850 mg", "Metformina XR 1.000 mg",
              "Dapagliflozina", "Empagliflozina", "Empagliflozina/metformina",
              "Vildagliptina 50 mg", "Vildagliptina/metformina",
              '"10 mg/día", "12,5 mg/día", "25 mg/día"',
              '"50/500 mg"', '"50/850 mg"', '"50/1.000 mg"',
              'groups: ["metformina-simple"]', 'groups: ["sglt2"]',
              'value: "vildaMet"', 'groups: ["vildagliptina"]',
              "comparteGrupo", "desmarcarConflictos", "Disponible en APS", "Otras opciones / compra particular"
          ]:
              if required_text not in aps_js:
                  raise SystemExit(f"Formulary/combination rule is missing: {required_text}")

          if 'groups: ["vildagliptina", "metformina-simple"]' in aps_js:
              raise SystemExit("Vildagliptina/metformina must be allowed with a simple metformin")

          for forbidden_text in [
              "no es una tabla de titulación",
              "No incluida en ADA Table 9.3",
              "uso local",
              "adaptación local",
              "esquema local",
              "NOTA_DOSIS",
              "NOTA_ARSENAL",
              "Insulog evita duplicar metforminas simples, iSGLT2 y vildagliptina.",
              "Metformina 850 mg · Metformina XR 1.000 mg · Dapagliflozina 10 mg · Vildagliptina 50 mg · Insulina NPH"
          ]:
              if forbidden_text in aps_js:
                  raise SystemExit(f"Removed medication note resurfaced: {forbidden_text}")

          for required_text in [
              ".aps-hypo-actions", ".aps-hypo-question", ".aps-safety-box",
              ".aps-med-copy", ".aps-med-efficacy", ".aps-med-dose-row", ".aps-med-dose",
              ".aps-med-safety", ".aps-efficacy-note", ".aps-med-section-title",
              "#p25", "grid-template-columns"
          ]:
              if required_text not in aps_css:
                  raise SystemExit(f"APS clinical UI styling is missing: {required_text}")

          for removed_style in [".aps-context-helper", ".aps-formulary-note"]:
              if removed_style in aps_css:
                  raise SystemExit(f"Unused medication note style resurfaced: {removed_style}")

          for required_text in [
              'onclick="nav(35)"', 'data-aps-med="seguimiento"', 'onclick="prepSeg()"',
              "CONTINUAR AL REGISTRO DE GLICEMIAS"
          ]:
              if required_text not in html:
                  raise SystemExit(f"Static follow-up treatment page is missing: {required_text}")

          if 'followup-flow-2026.js' in html or 'followup-flow-2026.js' in sw:
              raise SystemExit("Broken follow-up navigation must not be present")

          for required_text in [
              'const CACHE_NAME = "insulog-shell-20260827-atomic11"',
              'new Request(asset, { cache: "reload" })', 'cache.match("./index.html")',
              'addEventListener("fetch"', 'caches.delete',
              'event.waitUntil(refreshIndex.catch(() => undefined))',
              'event.waitUntil(refreshAsset.catch(() => undefined))', 'fetchFresh'
          ]:
              if required_text not in sw:
                  raise SystemExit(f"Fresh atomic app-shell service worker is missing: {required_text}")

          for required_asset in [
              './index.html', './styles.css?v=20260826', './app.js?v=20260826',
              './pdf-enhancements.css?v=20260827-3', './aps-safety-2026.css?v=20260827-2',
              './pdf-enhancements.js?v=20260827-3', './aps-safety-2026.js?v=20260827-2'
          ]:
              if required_asset not in sw:
                  raise SystemExit(f"Critical app-shell asset is not cached: {required_asset}")

          print("Patient-friendly insulin timing, tablet schedules, hypo review and atomic app-shell checks passed")
