name: Insulog static checks

on:
  push:
    branches: [main, optimize-app-2026-08, optimize-pdf-glucose-log, update-aps-safety-ada2026, emergency-recover-stable, disable-sw-interception, atomic-app-shell-cache, static-treatment-followup-page, hypoglycemia-alert-on-demand]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check pdf-enhancements.js
          node --check aps-safety-2026.js
          node --check sw.js

      - name: Validate manifest JSON
        run: python -m json.tool manifest.webmanifest > /dev/null

      - name: Validate essential application structure
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          pdf_js = Path("pdf-enhancements.js").read_text(encoding="utf-8")
          pdf_css = Path("pdf-enhancements.css").read_text(encoding="utf-8")
          aps_js = Path("aps-safety-2026.js").read_text(encoding="utf-8")
          sw = Path("sw.js").read_text(encoding="utf-8")
          required_ids = [
              "p0", "p1", "p2", "p3", "p35", "p4", "p41", "p5", "p6",
              "tratamiento-concomitante-seguimiento", "hipo-nivel3-evento",
              "peso-paciente", "factor-dosis", "peso-seguimiento",
              "tabla-seguimiento", "nota-clinica", "pdf"
          ]

          missing = [item for item in required_ids if f'id="{item}"' not in html]
          if missing:
              raise SystemExit(f"Missing required IDs: {missing}")

          if len(re.findall(r"<head(?:\s|>)", html, re.I)) != 1:
              raise SystemExit("index.html must contain exactly one <head>")

          if len(re.findall(r"</head>", html, re.I)) != 1:
              raise SystemExit("index.html must contain exactly one </head>")

          if './app.js?v=20260826' not in html:
              raise SystemExit("Optimized app.js is not loaded from index.html")

          if './pdf-enhancements.js?v=20260826-2' not in html:
              raise SystemExit("PDF enhancement JavaScript is not loaded")

          if './pdf-enhancements.css?v=20260826-2' not in html:
              raise SystemExit("PDF enhancement CSS is not loaded")

          for required_text in ["Preonce / Precena", "col-hora-medicion", "col-hgt"]:
              if required_text not in pdf_js:
                  raise SystemExit(f"PDF glucose log is missing: {required_text}")

          for required_text in [
              "alerta-hipoglicemia-ada",
              "Hipoglicemia ADA nivel 1",
              "Hipoglicemia ADA nivel 2",
              "Hipoglicemia ADA nivel 3",
              "value < 70",
              "minimo < 54",
              "hipo-nivel3-evento",
              "actualizarAlertaHipoglicemia"
          ]:
              if required_text not in pdf_js:
                  raise SystemExit(f"Dynamic ADA hypoglycemia alert is missing: {required_text}")

          for required_text in [
              "#p4 > .aps-safety-box",
              ".aps-safety-box.hypo-visible",
              "display: none",
              "display: block"
          ]:
              if required_text not in pdf_css:
                  raise SystemExit(f"Hypoglycemia alert visibility CSS is missing: {required_text}")

          for required_text in [
              "Metformina XR 1.000 mg",
              "Dapagliflozina 10 mg/día",
              "Empagliflozina 25 mg/día",
              "Empagliflozina 12,5 mg/día",
              "Vildagliptina 50 mg",
              "sobreinsulinización",
              "HIPOGLICEMIA NIVEL 3",
              "Promedio capilar global del registro"
          ]:
              if required_text not in aps_js:
                  raise SystemExit(f"APS safety layer is missing: {required_text}")

          for required_text in [
              'onclick="nav(35)"',
              "Tratamiento concomitante disponible en APS",
              'data-aps-med="seguimiento"',
              'onclick="prepSeg()"',
              "CONTINUAR AL REGISTRO DE GLICEMIAS"
          ]:
              if required_text not in html:
                  raise SystemExit(f"Static treatment page is missing: {required_text}")

          if 'aps-safety-2026.js?v=20260826-1' not in pdf_js:
              raise SystemExit("APS safety JavaScript loader is missing")

          if 'aps-safety-2026.css?v=20260826-1' not in pdf_js:
              raise SystemExit("APS safety CSS loader is missing")

          if 'followup-flow-2026.js' in pdf_js or 'followup-flow-2026.js' in sw:
              raise SystemExit("Broken follow-up navigation must not be present")

          for required_text in [
              'const CACHE_NAME = "insulog-shell-20260827-atomic3"',
              'new Request(asset, { cache: "reload" })',
              'cache.match("./index.html")',
              'addEventListener("fetch"',
              'caches.delete'
          ]:
              if required_text not in sw:
                  raise SystemExit(f"Atomic app-shell service worker is missing: {required_text}")

          for required_asset in [
              './index.html',
              './styles.css?v=20260826',
              './app.js?v=20260826',
              './pdf-enhancements.js?v=20260826-2',
              './aps-safety-2026.js?v=20260826-1'
          ]:
              if required_asset not in sw:
                  raise SystemExit(f"Critical app-shell asset is not cached: {required_asset}")

          print("Dynamic ADA hypoglycemia alert and atomic app-shell checks passed")
