name: Insulog static checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check JavaScript syntax
        run: |
          node --check app-runtime.js
          node --check clinical-engine.js
          node --check clinical-copy.js
          node --check note-presenter.js
          node --check app.js
          node --check patient-document.js
          node --check app-shell.js
          node --check pdf-enhancements.js
          node --check aps-safety-2026.js
          node --check farmacia-popular.js
          node --check document-flow.js
          node --check sw.js
          node --check tests/clinical-engine.test.js
          node --check tests/clinical-engine-regression.test.js
          node --check tests/clinical-engine-contract.test.js
          node --check tests/clinical-copy.test.js
          node --check tests/note-presenter.test.js

      - name: Run clinical engine equivalence tests
        run: |
          node tests/clinical-engine.test.js
          node tests/clinical-engine-regression.test.js
          node tests/clinical-engine-contract.test.js

      - name: Run exact clinical-copy regression
        run: npm run test:clinical-copy

      - name: Run exact note-presenter regression
        run: npm run test:note-presenter

      - name: Validate manifest JSON
        run: |
          python -m json.tool manifest.webmanifest > /dev/null
          python -m json.tool clinical-protocol.json > /dev/null

      - name: Validate clinical protocol governance
        run: npm run check:clinical-protocol

      - name: Validate application invariants through maintenance command
        run: npm run check:invariants

      - name: Validate canonical release and immutable shell through maintenance command
        run: npm run check:release
