name: Insulog static checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app-runtime.js
          node --check app.js
          node --check patient-document.js
          node --check app-shell.js
          node --check pdf-enhancements.js
          node --check aps-safety-2026.js
          node --check farmacia-popular.js
          node --check document-flow.js
          node --check sw.js

      - name: Validate manifest JSON
        run: python -m json.tool manifest.webmanifest > /dev/null

      - name: Validate application invariants
        run: python scripts/check_invariants.py
