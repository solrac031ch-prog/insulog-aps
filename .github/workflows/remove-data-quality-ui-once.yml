name: Remove redundant data quality UI once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-data-quality-ui-once.yml

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove redundant sufficiency card
        run: python scripts/remove_data_quality_ui_once.py

      - name: Refresh canonical PWA release fingerprint
        run: python scripts/app_shell_release.py --write

      - name: Validate static and clinical invariants
        run: |
          node --check phase6b-professional-decision.js
          node --check phase6b-document-sync.js
          npm run check:clinical-protocol
          npm run test:clinical-copy
          npm run test:note-presenter
          npm run check:invariants
          npm run check:release

      - name: Commit simplification and clean one-off files
        run: |
          rm .github/workflows/remove-data-quality-ui-once.yml
          rm scripts/remove_data_quality_ui_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase6b-professional-decision.js index.html pdf-preview.html sw.js .github/workflows/remove-data-quality-ui-once.yml scripts/remove_data_quality_ui_once.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Simplify follow-up screen and remove redundant sufficiency card"
          git push origin HEAD:main
