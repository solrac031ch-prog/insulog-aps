name: Apply PDF preview page split

on:
  push:
    branches: [pdf-preview-next-page]
    paths:
      - ".github/workflows/_apply-pdf-preview-page.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pdf-preview-next-page

      - name: Split preparation and PDF preview pages
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          if './pdf-design-2026.css?v=20260827-1' not in html:
              html = html.replace(
                  '  <link rel="stylesheet" href="./pdf-enhancements.css?v=20260827-3">\n',
                  '  <link rel="stylesheet" href="./pdf-enhancements.css?v=20260827-3">\n'
                  '  <link rel="stylesheet" href="./pdf-design-2026.css?v=20260827-1">\n'
                  '  <link rel="stylesheet" href="./document-flow.css?v=20260827-1">\n'
              )
          elif './document-flow.css?v=20260827-1' not in html:
              html = html.replace(
                  '  <link rel="stylesheet" href="./pdf-design-2026.css?v=20260827-1">\n',
                  '  <link rel="stylesheet" href="./pdf-design-2026.css?v=20260827-1">\n'
                  '  <link rel="stylesheet" href="./document-flow.css?v=20260827-1">\n'
              )

          replacement = '''
    <section id="p6" class="page page-center pdf-preparation-page" aria-hidden="true">
      <div class="page-label no-print">[P6] Preparación del documento</div>
      <h2 class="no-print">Informe clínico Insulog APS</h2>

      <div class="field patient-field no-print">
        <label for="nombre-paciente">Nombre del paciente</label>
        <input type="text" id="nombre-paciente" placeholder="Escriba o pegue nombre completo" autocomplete="off">
      </div>

      <div class="date-row no-print">Fecha: <span id="fecha-hoy"></span></div>

      <div class="document-actions no-print">
        <button type="button" class="btn btn-main" onclick="mostrarDocumento('inicio')">INICIO DE INSULINA</button>
        <button type="button" class="btn btn-main" onclick="mostrarDocumento('seguimiento')">SEGUIMIENTO Y AJUSTE</button>
        <button type="button" class="btn btn-success" onclick="mostrarDocumento('pscv')">CONTROL PROGRAMA CV</button>
      </div>
    </section>

    <section id="p7" class="page pdf-preview-page" aria-hidden="true">
      <div class="page-label no-print">[P7] Vista previa del documento</div>
      <h2 class="no-print text-center">Documento listo para imprimir</h2>

      <div class="pdf-preview-toolbar no-print">
        <button type="button" class="btn" onclick="volverPreparacionDocumento()">VOLVER / CAMBIAR DATOS</button>
        <button type="button" class="btn btn-main" onclick="window.print()">IMPRIMIR</button>
        <button type="button" class="btn btn-danger" onclick="finalizar()">FINALIZAR</button>
      </div>

      <div id="pdf" class="imprimible-container" aria-live="polite"></div>
    </section>
'''

          pattern = re.compile(r'\n    <section id="p6" class="page page-center" aria-hidden="true">.*?\n    </section>\n', re.S)
          html, count = pattern.subn(replacement, html, count=1)
          if count != 1 and 'id="p7"' not in html:
              raise SystemExit(f"Expected to replace exactly one P6 block, replaced {count}")

          if './document-flow.js?v=20260827-1' not in html:
              html = html.replace(
                  '  <script src="./aps-safety-2026.js?v=20260827-2"></script>\n',
                  '  <script src="./aps-safety-2026.js?v=20260827-2"></script>\n'
                  '  <script src="./document-flow.js?v=20260827-1"></script>\n'
              )

          path.write_text(html, encoding="utf-8")

      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Separate PDF preparation and preview pages"
          git push origin HEAD:pdf-preview-next-page
