name: Drive follow-up release fingerprint

on:
  push:
    branches:
      - drive-followup-validation

permissions:
  contents: write

jobs:
  rewrite-release:
    if: ${{ !contains(github.event.head_commit.message, '[release-fingerprint]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drive-followup-validation
          fetch-depth: 0
      - name: Rewrite canonical app-shell release token
        run: python scripts/app_shell_release.py --write
      - name: Commit generated release files
        run: |
          if git diff --quiet -- index.html pdf-preview.html sw.js; then
            echo "Release token already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pdf-preview.html sw.js
          git commit -m "chore: refresh app shell fingerprint [release-fingerprint]"
          git push origin HEAD:drive-followup-validation
