name: Temporary Phase 2 source consistency patch

on:
  push:
    branches: [pwa-source-consistency-20260910]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: pwa-source-consistency-20260910
          fetch-depth: 0

      - name: Move runtime normalization into source
        shell: python
        run: |
          from pathlib import Path

          # 1) Make the medication source itself match what production previously
          #    obtained only after service-worker response rewriting.
          aps_path = Path("aps-safety-2026.js")
          aps = aps_path.read_text(encoding="utf-8")
          replacements = {
              'label: "Empagliflozina 10 mg"': 'label: "Empagliflozina"',
              'doses: ["12,5/1.000 mg/día"]': 'doses: ["12,5/850 mg/día", "12,5/1.000 mg/día"]',
          }
          for old, new in replacements.items():
              if aps.count(old) != 1:
                  raise SystemExit(f"Expected exactly one APS source marker: {old}")
              aps = aps.replace(old, new, 1)
          aps_path.write_text(aps, encoding="utf-8")

          # 2) Version the changed source in the HTML shell.
          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")
          old_asset = './aps-safety-2026.js?v=20260827-2'
          new_asset = './aps-safety-2026.js?v=20260910-1'
          if html.count(old_asset) != 1:
              raise SystemExit("Unexpected APS safety script reference count in index.html")
          html = html.replace(old_asset, new_asset, 1)
          index_path.write_text(html, encoding="utf-8")

          # 3) Service worker becomes a cache/update layer only: it must never edit JS.
          sw_path = Path("sw.js")
          sw = sw_path.read_text(encoding="utf-8")
          sw = sw.replace(
              'const CACHE_NAME = "insulog-shell-20260903-atomic15";',
              'const CACHE_NAME = "insulog-shell-20260910-atomic16";',
              1,
          )
          sw = sw.replace(
              'const DEPLOYMENT_REVISION = "stable-app-shell-20260903-r1";',
              'const DEPLOYMENT_REVISION = "source-consistent-20260910-r1";',
              1,
          )
          sw = sw.replace(old_asset, new_asset, 1)

          start = sw.find("function respuestaTexto(")
          fetch_start = sw.find("async function fetchFresh", start)
          if start == -1 or fetch_start == -1:
              raise SystemExit("Could not locate legacy service-worker response rewriting")
          sw = sw[:start] + sw[fetch_start:]
          if "return normalizarAsset(request, response);" not in sw:
              raise SystemExit("Could not locate legacy normalizarAsset return")
          sw = sw.replace("return normalizarAsset(request, response);", "return response;", 1)

          if "normalizarAsset" in sw or "respuestaTexto" in sw:
              raise SystemExit("Service worker still contains source rewriting")
          if new_asset not in sw:
              raise SystemExit("New APS safety asset is missing from app shell")
          sw_path.write_text(sw, encoding="utf-8")

          # 4) Keep the legacy static suite aligned with the current source version.
          static_path = Path(".github/workflows/static-check.yml")
          static = static_path.read_text(encoding="utf-8")
          if old_asset not in static:
              raise SystemExit("Static check does not contain expected APS asset marker")
          static = static.replace(old_asset, new_asset)
          static_path.write_text(static, encoding="utf-8")

          print("Phase 2 source-consistency patch prepared")

      - name: Validate patch before commit
        run: |
          node --check aps-safety-2026.js
          node --check sw.js
          grep -q 'label: "Empagliflozina"' aps-safety-2026.js
          grep -q 'doses: \["12,5/850 mg/día", "12,5/1.000 mg/día"\]' aps-safety-2026.js
          ! grep -q 'normalizarAsset' sw.js
          ! grep -q 'respuestaTexto' sw.js
          grep -q 'insulog-shell-20260910-atomic16' sw.js

      - name: Commit source-consistency patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aps-safety-2026.js index.html sw.js .github/workflows/static-check.yml
          git commit -m "Make PWA assets identical to source"
          git push origin HEAD:pwa-source-consistency-20260910
