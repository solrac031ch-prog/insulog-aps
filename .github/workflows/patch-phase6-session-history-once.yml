name: Patch Phase 6 session history once

on:
  push:
    paths:
      - .github/workflows/patch-phase6-session-history-once.yml

permissions:
  contents: write

jobs:
  patch-and-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace persistent history with ephemeral session memory
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app-shell.js")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '  const BEST_HISTORY_KEY = "insulog.history.v1";\n  const BEST_HISTORY_LIMIT = 100;\n  let bestReviewStatus = "";',
                  '  const BEST_HISTORY_LIMIT = 100;\n  let bestSessionHistory = [];\n  let bestReviewStatus = "";'
              ),
              (
                  '''  function browserStorage() {\n    try { return window.localStorage; } catch { return null; }\n  }\n\n  function readBestHistory() {\n    const storage = browserStorage();\n    if (!storage) return [];\n    try {\n      const parsed = JSON.parse(storage.getItem(BEST_HISTORY_KEY) || "[]");\n      return Array.isArray(parsed) ? parsed.filter((item) => item && typeof item === "object") : [];\n    } catch {\n      return [];\n    }\n  }\n\n  function writeBestHistory(entries) {\n    const storage = browserStorage();\n    if (!storage) throw new Error("Almacenamiento local no disponible en este navegador.");\n    storage.setItem(BEST_HISTORY_KEY, JSON.stringify(entries.slice(0, BEST_HISTORY_LIMIT)));\n  }''',
                  '''  function readBestHistory() {\n    return bestSessionHistory.slice();\n  }\n\n  function writeBestHistory(entries) {\n    bestSessionHistory = entries.slice(0, BEST_HISTORY_LIMIT);\n    return readBestHistory();\n  }'''
              ),
              (
                  '''  function safeNumber(value) {\n    const number = Number(value);\n    return Number.isFinite(number) ? number : null;\n  }\n\n  function doseText(am, pm) {\n    const parts = [];\n    if (Number.isFinite(Number(am))) parts.push(`AM ${Math.round(Number(am))} UI`);\n    if (Number.isFinite(Number(pm))) parts.push(`PM ${Math.round(Number(pm))} UI`);\n    return parts.length ? parts.join(" · ") : "No registrada";\n  }''',
                  '''  function safeNumber(value) {\n    if (value === null || value === undefined || String(value).trim() === "") return null;\n    const number = Number(value);\n    return Number.isFinite(number) ? number : null;\n  }\n\n  function doseText(am, pm) {\n    const parts = [];\n    const amValue = safeNumber(am);\n    const pmValue = safeNumber(pm);\n    if (amValue !== null) parts.push(`AM ${Math.round(amValue)} UI`);\n    if (pmValue !== null) parts.push(`PM ${Math.round(pmValue)} UI`);\n    return parts.length ? parts.join(" · ") : "No registrada";\n  }'''
              ),
              (
                  '''    if (!browserStorage()) {\n      host.innerHTML = '<div class="alert alert-warning">El almacenamiento local no está disponible en este navegador.</div>';\n      return;\n    }\n''',
                  ''
              ),
              (
                  '''    actions.register("best-history-clear", () => {\n      if (!browserStorage()) return;\n      if (!window.confirm("¿Borrar todos los casos guardados en el historial local de este navegador?")) return;\n      browserStorage().removeItem(BEST_HISTORY_KEY);\n      renderBestHistory();\n    });''',
                  '''    actions.register("best-history-clear", () => {\n      if (!window.confirm("¿Borrar todos los casos guardados durante esta sesión?")) return;\n      writeBestHistory([]);\n      renderBestHistory();\n    });'''
              ),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f"Expected Phase 6A block not found: {old[:90]!r}")
              source = source.replace(old, new, 1)

          text_replacements = {
              "Historial longitudinal local": "Historial temporal de la sesión",
              "Se guarda sólo en este navegador y no se sincroniza con un servidor. Use un alias o código local; no ingrese RUT ni nombre completo.": "Se conserva sólo durante esta sesión y se borra al recargar o cerrar la app. No se sincroniza con un servidor. Use un alias o código local; no ingrese RUT ni nombre completo.",
              "Historial · almacenamiento local": "Historial · sesión actual",
              "Casos guardados manualmente en este navegador. No se sincronizan con la ficha clínica ni con un servidor.": "Casos guardados temporalmente durante esta sesión. Se borran al recargar o cerrar la app y no se sincronizan con la ficha clínica ni con un servidor.",
              "VER HISTORIAL LOCAL": "VER HISTORIAL DE LA SESIÓN",
              "BORRAR TODO EL HISTORIAL LOCAL": "BORRAR HISTORIAL DE LA SESIÓN",
              "✓ Caso guardado localmente:": "✓ Caso guardado en esta sesión:",
              "Los casos aparecen aquí sólo después de guardarlos manualmente desde el resultado clínico.": "Los casos aparecen aquí sólo después de guardarlos manualmente durante la sesión actual.",
          }
          for old, new in text_replacements.items():
              if old not in source:
                  raise SystemExit(f"Expected copy not found: {old}")
              source = source.replace(old, new)

          forbidden = ["localStorage", "sessionStorage", "indexedDB"]
          found = [token for token in forbidden if token in source]
          if found:
              raise SystemExit(f"Persistent browser storage remains in app-shell.js: {found}")

          path.write_text(source, encoding="utf-8")
          PY

      - name: Check JavaScript syntax
        run: node --check app-shell.js

      - name: Refresh canonical PWA release fingerprint
        run: python scripts/app_shell_release.py --write

      - name: Remove one-shot workflow and commit final Phase 6A shell
        run: |
          rm .github/workflows/patch-phase6-session-history-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-shell.js index.html pdf-preview.html sw.js .github/workflows/patch-phase6-session-history-once.yml
          git commit -m "Phase 6A: preserve privacy with ephemeral history"
          git push
