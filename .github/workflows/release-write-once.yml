name: Regenerate app shell release once

on:
  push:
    paths:
      - .github/workflows/release-write-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate canonical app-shell release
        run: python scripts/app_shell_release.py --write
      - name: Commit generated release and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pdf-preview.html sw.js
          git rm .github/workflows/release-write-once.yml
          git commit -m "Release: regenerate canonical app shell for clinical r2"
          git push
