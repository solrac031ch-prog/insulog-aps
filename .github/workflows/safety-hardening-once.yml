name: Safety hardening once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/safety-hardening-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fail-safe hardening
        run: python scripts/safety_hardening_once.py

      - name: Refresh canonical PWA release
        run: npm run release:write

      - name: Validate hardened release
        run: |
          node --check clinical-engine.js
          node --check safety-guard.js
          node --check app.js
          node --check app-shell.js
          node --check sw.js
          node tests/clinical-engine.test.js
          node tests/clinical-engine-regression.test.js
          node tests/clinical-engine-contract.test.js
          node tests/clinical-engine-hardening.test.js
          npm run test:clinical-copy
          npm run test:note-presenter
          npm run check:clinical-protocol
          npm run check:invariants
          npm run check:release

      - name: Commit hardened application only
        run: |
          git checkout -- .github/workflows/static-check.yml
          rm -f scripts/safety_hardening_once.py
          rm -rf scripts/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git commit -m "Harden clinical fail-safe validation and runtime safety"
          git push
