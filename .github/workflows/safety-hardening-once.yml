const assert = require("node:assert/strict");
const engine = require("../clinical-engine.js");

assert.equal(engine.version, "APS-NPH-2026.09.14-r2");
assert.equal(engine.MIN_REQUIRED_READINGS, 3);
assert.equal(engine.GLUCOSE_MIN_MGDL, 1);
assert.equal(engine.GLUCOSE_MAX_MGDL, 700);

const incompleteSensitivity = engine.assessInsulinSensitivity({ age: 60, bmi: 25 });
assert.equal(incompleteSensitivity.factor, 0.1, "datos incompletos deben usar inicio conservador");
assert.equal(incompleteSensitivity.category, "uncertain");

const invalidInitial = engine.calculateInitialDose({ weightKg: 70, factor: 0.2, scheme: "desconocido" });
assert.equal(invalidInitial.valid, false);
assert.equal(invalidInitial.total, 0);

let followup = engine.calculateFollowup({
  weightKg: 70, regimenType: "pm", amDose: 0, pmDose: 20,
  fastingValues: [160, 170], targetA1c: 7
});
assert.equal(followup.dataSufficient, false);
assert.equal(followup.blocksDoseChange, true);
assert.equal(followup.pm, 20, "con menos de 3 HGT no debe cambiar la dosis");

followup = engine.calculateFollowup({
  weightKg: 70, regimenType: "pm", amDose: 0, pmDose: 20,
  fastingValues: [160, 170, 999], targetA1c: 7
});
assert.equal(followup.inputValid, false);
assert.equal(followup.pm, 20, "un valor fuera de rango debe bloquear, no ser ignorado");
assert.ok(followup.validationErrors.some((item) => /inválid/i.test(item)));

followup = engine.calculateFollowup({
  weightKg: 100, regimenType: "2", amDose: 20, pmDose: 20,
  fastingValues: [69, 90, 100], preLunchValues: [250, 250, 250], targetA1c: 7
});
assert.ok(followup.pm <= 20, "la dosis vinculada a hipoglicemia no puede aumentar");
assert.equal(followup.am, 20, "una hipoglicemia en cualquier perfil bloquea el aumento de la otra dosis");
assert.match(followup.advertencias.join(" "), /bloqueó cualquier aumento automático/);

followup = engine.calculateFollowup({
  weightKg: Number.NaN, regimenType: "pm", amDose: 0, pmDose: 20,
  fastingValues: [160, 170, 180], targetA1c: 7
});
assert.equal(followup.inputValid, false);
assert.equal(followup.blocksDoseChange, true);

const unknownSafety = engine.assessDoseSafety(Number.NaN);
assert.equal(unknownSafety.blocksAutomaticEscalation, true, "UI/kg desconocida debe fallar cerrada");
assert.equal(unknownSafety.requiresHighDoseReview, true);

console.log("Clinical engine fail-safe hardening checks passed");
