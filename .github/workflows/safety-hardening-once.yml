name: Safety hardening once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/safety-hardening-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fail-safe hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected snippet not found in {path}: {old[:90]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # --- clinical-engine.js: explicit version + input normalization + fail-closed follow-up ---
          p = Path('clinical-engine.js')
          text = p.read_text(encoding='utf-8')
          marker = '  function roundUnits(value) {'
          insert = '''  const CLINICAL_ENGINE_VERSION = "APS-NPH-2026.09.14-r2";\n  const MIN_REQUIRED_READINGS = 3;\n  const GLUCOSE_MIN_MGDL = 1;\n  const GLUCOSE_MAX_MGDL = 700;\n\n  function normalizeGlucoseValues(values = []) {\n    const valid = [];\n    const invalid = [];\n    for (const raw of values) {\n      const value = Number(raw);\n      if (!Number.isFinite(value)) continue;\n      if (!Number.isInteger(value) || value < GLUCOSE_MIN_MGDL || value > GLUCOSE_MAX_MGDL) invalid.push(value);\n      else valid.push(value);\n    }\n    return Object.freeze({ valid: Object.freeze(valid), invalid: Object.freeze(invalid) });\n  }\n\n'''
          if 'const CLINICAL_ENGINE_VERSION' not in text:
              if marker not in text: raise SystemExit('roundUnits marker not found')
              text = text.replace(marker, insert + marker, 1)

          old = '''    const ageValue = Number(age);\n    const bmiValue = Number(bmi);\n    const egfrValue = Number(egfr);\n    const sensitive = hypoRisk.length > 0 ||'''
          new = '''    const ageValue = Number(age);\n    const bmiValue = Number(bmi);\n    const egfrValue = Number(egfr);\n    if (!Number.isFinite(ageValue) || !Number.isFinite(bmiValue) || !Number.isFinite(egfrValue)) {\n      return Object.freeze({ category: "uncertain", factor: 0.1, label: "Datos incompletos · inicio conservador" });\n    }\n    const sensitive = hypoRisk.length > 0 ||'''
          if old not in text: raise SystemExit('sensitivity patch target missing')
          text = text.replace(old, new, 1)

          old = '''  function calculateInitialDose({ weightKg, factor, scheme } = {}) {\n    const weight = Number(weightKg);\n    if (!Number.isFinite(weight) || weight <= 0) return Object.freeze({ total: 0, am: 0, pm: 0, dosePerKg: Number.NaN });'''
          new = '''  function calculateInitialDose({ weightKg, factor, scheme } = {}) {\n    const weight = Number(weightKg);\n    const allowedSchemes = new Set(["monodosis_pm", "monodosis_am", "doble_dosis"]);\n    if (!Number.isFinite(weight) || weight <= 0 || weight > 300 || !allowedSchemes.has(scheme)) {\n      return Object.freeze({ valid: false, total: 0, am: 0, pm: 0, dosePerKg: Number.NaN, factorApplied: 0 });\n    }'''
          if old not in text: raise SystemExit('initial dose patch target missing')
          text = text.replace(old, new, 1)
          text = text.replace('return Object.freeze({ total, am, pm, dosePerKg: total / weight, factorApplied: safeFactor });', 'return Object.freeze({ valid: true, total, am, pm, dosePerKg: total / weight, factorApplied: safeFactor });', 1)

          text = re.sub(
              r'  function analyzeGlucose\(values, name\) \{.*?\n  \}\n\n  function classifyHypoglycemia',
              '''  function analyzeGlucose(values, name) {\n    const normalized = normalizeGlucoseValues(values);\n    const data = [...normalized.valid];\n    const minimum = data.length ? Math.min(...data) : null;\n    return Object.freeze({\n      datos: data, usados: [...data], invalidos: [...normalized.invalid],\n      promedio: data.length ? data.reduce((a, b) => a + b, 0) / data.length : null,\n      min: minimum, hypoglycemiaLevel2: minimum !== null && minimum < 54, hipo: minimum !== null && minimum < 70,\n      excluidos: [], discordantes: detectDiscordantHighs(data, name)\n    });\n  }\n\n  function classifyHypoglycemia''',
              text, count=1, flags=re.S
          )
          text = text.replace('    const data = values.filter((value) => Number.isFinite(value));\n    const hypoglycemicValues = data.filter((value) => value < 70);', '    const data = [...normalizeGlucoseValues(values).valid];\n    const hypoglycemicValues = data.filter((value) => value < 70);', 1)

          text = re.sub(
              r'  function calculateAdjustment\(analysis, doseName, currentDose = 0, targetA1c = 7\) \{.*?\n  \}\n\n  function calculateSecondDose',
              '''  function calculateAdjustment(analysis, doseName, currentDose = 0, targetA1c = 7) {\n    const current = Number(currentDose);\n    const dose = Number.isFinite(current) && current >= 0 ? roundUnits(current) : 0;\n    const count = Array.isArray(analysis?.usados) ? analysis.usados.length : 0;\n    const hasInvalid = Array.isArray(analysis?.invalidos) && analysis.invalidos.length > 0;\n    if (!analysis || analysis.min === null || count < MIN_REQUIRED_READINGS || hasInvalid) {\n      return Object.freeze({\n        ajuste: 0, percent: 0, newDose: dose, reference: analysis?.min ?? null,\n        target: targetProfile(targetA1c), dataSufficient: false, blocked: true,\n        texto: `${doseName}: ajuste bloqueado; se requieren al menos ${MIN_REQUIRED_READINGS} glicemias válidas y sin valores inválidos`\n      });\n    }\n\n    const profile = targetProfile(targetA1c);\n    const reference = analysis.min;\n    let percent = 0;\n    if (reference < profile.lower) percent = analysis.hipo ? -20 : -10;\n    else if (reference <= profile.upper) percent = 0;\n    else if (reference <= profile.high10) percent = 10;\n    else percent = 20;\n\n    const newDose = Math.max(0, roundUnits(dose * (1 + percent / 100)));\n    const ajuste = newDose - dose;\n    let action = "mantener";\n    if (percent > 0) action = `aumentar ${percent}%`;\n    if (percent < 0) action = `disminuir ${Math.abs(percent)}%`;\n\n    return Object.freeze({\n      ajuste, percent, newDose, reference, target: profile, dataSufficient: true, blocked: false,\n      texto: `${doseName}: ${action} usando el menor de los controles (${reference} mg/dL), meta preprandial ${profile.lower}-${profile.upper} mg/dL para HbA1c objetivo <${profile.hba1c}%.`\n    });\n  }\n\n  function calculateSecondDose''',
              text, count=1, flags=re.S
          )

          text = text.replace(
              'if (!Number.isFinite(dosePerKg)) return Object.freeze({ level: "unknown", requiresHighDoseReview: false, blocksAutomaticEscalation: false, warning: "" });',
              'if (!Number.isFinite(dosePerKg)) return Object.freeze({ level: "unknown", requiresHighDoseReview: true, blocksAutomaticEscalation: true, warning: "No es posible calcular UI/kg/día de forma segura: revisar peso y dosis antes de titular." });',
              1
          )

          start = text.index('  function calculateFollowup(')
          end = text.index('\n  return Object.freeze({\n    TARGET_PROFILES', start)
          new_followup = r'''  function calculateFollowup({ weightKg, regimenType, amDose, pmDose, fastingValues = [], preLunchValues = [], preElevenValues = [], targetA1c = 7 } = {}) {
    const validationErrors = [];
    const weight = Number(weightKg);
    const allowedRegimens = new Set(["pm", "am", "2"]);
    const rawAm = Number(amDose);
    const rawPm = Number(pmDose);

    if (!Number.isFinite(weight) || weight <= 0 || weight > 300) validationErrors.push("Peso inválido: debe estar entre >0 y 300 kg.");
    if (!allowedRegimens.has(regimenType)) validationErrors.push("Tipo de esquema no reconocido.");
    if (!Number.isInteger(rawAm) || rawAm < 0 || rawAm > 150) validationErrors.push("Dosis AM inválida: use un entero entre 0 y 150 UI.");
    if (!Number.isInteger(rawPm) || rawPm < 0 || rawPm > 150) validationErrors.push("Dosis PM inválida: use un entero entre 0 y 150 UI.");

    let am = Number.isInteger(rawAm) && rawAm >= 0 ? rawAm : 0;
    let pm = Number.isInteger(rawPm) && rawPm >= 0 ? rawPm : 0;
    if (regimenType === "am") pm = 0;
    if (regimenType === "pm") am = 0;
    if (regimenType === "am" && am <= 0) validationErrors.push("El esquema AM requiere una dosis AM actual mayor que 0.");
    if (regimenType === "pm" && pm <= 0) validationErrors.push("El esquema PM requiere una dosis PM actual mayor que 0.");
    if (regimenType === "2" && (am <= 0 || pm <= 0)) validationErrors.push("El esquema AM + PM requiere ambas dosis actuales mayores que 0.");

    const preValues = preLunchValues.length ? preLunchValues : preElevenValues;
    const fasting = analyzeGlucose(fastingValues, "Ayunas");
    const preLunch = preValues.length ? analyzeGlucose(preValues, "Pre-almuerzo") : null;
    const requiresFasting = regimenType === "pm" || regimenType === "2";
    const requiresPreLunch = regimenType === "am" || regimenType === "2";

    if (fasting.invalidos.length) validationErrors.push(`Glicemias en ayunas inválidas: ${fasting.invalidos.join(", ")} mg/dL.`);
    if (preLunch?.invalidos.length) validationErrors.push(`Glicemias pre-almuerzo inválidas: ${preLunch.invalidos.join(", ")} mg/dL.`);
    if (requiresFasting && fasting.usados.length < MIN_REQUIRED_READINGS) validationErrors.push(`Se requieren al menos ${MIN_REQUIRED_READINGS} glicemias válidas en ayunas.`);
    if (requiresPreLunch && (!preLunch || preLunch.usados.length < MIN_REQUIRED_READINGS)) validationErrors.push(`Se requieren al menos ${MIN_REQUIRED_READINGS} glicemias válidas pre-almuerzo.`);

    const inputValid = validationErrors.length === 0;
    const dataSufficient = inputValid;
    const pmAdjustment = calculateAdjustment(fasting, "PM", pm, targetA1c);
    const amAdjustment = preLunch
      ? calculateAdjustment(preLunch, "AM", am, targetA1c)
      : Object.freeze({ ajuste: 0, percent: 0, newDose: am, dataSufficient: false, blocked: true, texto: "AM: ajuste bloqueado; faltan glicemias pre-almuerzo" });

    let newAm = am;
    let newPm = pm;
    const reasoning = [];
    const warnings = [];

    if (!dataSufficient) {
      reasoning.push("Titulación automática bloqueada por datos insuficientes o inválidos; se mantienen las dosis actuales.");
      warnings.push(...validationErrors);
    } else if (regimenType === "pm") {
      newPm = pmAdjustment.newDose;
      reasoning.push(pmAdjustment.texto);
    } else if (regimenType === "am") {
      newAm = amAdjustment.newDose;
      reasoning.push(amAdjustment.texto);
    } else {
      newPm = pmAdjustment.newDose;
      newAm = amAdjustment.newDose;
      reasoning.push(pmAdjustment.texto, amAdjustment.texto);
    }

    const anyHypo = fasting.hipo || Boolean(preLunch?.hipo);
    if (anyHypo) {
      if (newAm > am) newAm = am;
      if (newPm > pm) newPm = pm;
      warnings.push("Hipoglicemia registrada: se bloqueó cualquier aumento automático de NPH en esta evaluación hasta reevaluar causas y seguridad.");
    }
    if (fasting.hypoglycemiaLevel2) warnings.push("Hipoglicemia nivel 2 en ayunas (<54 mg/dL): tratamiento inmediato del episodio y reevaluación de NPH PM.");
    else if (fasting.hipo) warnings.push("Hipoglicemia nivel 1 en ayunas: reevaluar NPH PM y causas precipitantes.");
    if (preLunch?.hypoglycemiaLevel2) warnings.push("Hipoglicemia nivel 2 pre-almuerzo (<54 mg/dL): tratamiento inmediato del episodio y reevaluación de NPH AM.");
    else if (preLunch?.hipo) warnings.push("Hipoglicemia nivel 1 pre-almuerzo: reevaluar NPH AM y causas precipitantes.");

    const currentPerKg = Number.isFinite(weight) && weight > 0 ? (am + pm) / weight : Number.NaN;
    const projectedPerKg = Number.isFinite(weight) && weight > 0 ? (newAm + newPm) / weight : Number.NaN;
    const projectedSafety = assessDoseSafety(projectedPerKg);
    let automaticEscalationBlocked = false;
    if (newAm + newPm > am + pm && projectedSafety.blocksAutomaticEscalation) {
      automaticEscalationBlocked = true;
      newAm = am;
      newPm = pm;
      warnings.push("La titulación propuesta alcanzaría o superaría 0,5 UI/kg/día de insulina basal; se bloqueó el aumento automático y se requiere reevaluación clínica.");
    }

    const dosePerKg = Number.isFinite(weight) && weight > 0 ? (newAm + newPm) / weight : Number.NaN;
    const doseSafety = assessDoseSafety(dosePerKg);
    if (doseSafety.warning && !validationErrors.length) warnings.push(doseSafety.warning);

    const discordant = [...fasting.discordantes, ...(preLunch ? preLunch.discordantes : [])];
    const availableValues = [...fasting.datos, ...(preLunch ? preLunch.datos : [])];
    const globalAverage = availableValues.length ? availableValues.reduce((a, b) => a + b, 0) / availableValues.length : null;
    if (discordant.length) warnings.push(`Valores discordantes: ${discordant.join(", ")}. Se conservan como dato clínico y no se excluyen automáticamente.`);

    const profile = targetProfile(targetA1c);
    const explanation = [
      `Esquema final sugerido: ${regimenLabel(regimenType)}`,
      `Meta individualizada: HbA1c <${profile.hba1c}% (preprandial ${profile.lower}-${profile.upper} mg/dL).`,
      ...reasoning,
      warnings.length ? `Advertencias: ${warnings.join(" ")}` : ""
    ].filter(Boolean).join("\n");

    return Object.freeze({
      amActual: am, pmActual: pm, am: Math.max(0, newAm), pm: Math.max(0, newPm),
      schemeFinal: regimenType, schemeLabel: regimenLabel(regimenType), fasting, preLunch, preEleven: preLunch,
      promAy: fasting.promedio !== null ? Math.round(fasting.promedio) : "N/A",
      promPre: preLunch?.promedio !== null && preLunch ? Math.round(preLunch.promedio) : "N/A",
      minAy: fasting.min !== null ? fasting.min : "N/A", minPre: preLunch?.min !== null && preLunch ? preLunch.min : "N/A",
      promedioGlobal: globalAverage !== null ? Math.round(globalAverage) : "N/A", dosisKg: dosePerKg, currentDosePerKg: currentPerKg,
      doseSafety,
      inputValid,
      dataSufficient,
      validationErrors: Object.freeze([...validationErrors]),
      blocksDoseChange: !dataSufficient || automaticEscalationBlocked,
      requiresHighDoseReview: automaticEscalationBlocked || doseSafety.requiresHighDoseReview,
      blocksAutomaticEscalation: automaticEscalationBlocked || doseSafety.blocksAutomaticEscalation,
      automaticEscalationBlocked,
      razonamiento: reasoning, advertencias: warnings, excluidos: [], discordantes: discordant, explicacion: explanation,
      targetA1c: normalizeTargetA1c(targetA1c)
    });
  }
'''
          text = text[:start] + new_followup + text[end:]
          text = text.replace(
              '    TARGET_PROFILES, roundUnits, roundEven, normalizeTargetA1c, targetProfile, assessInsulinSensitivity,',
              '    version: CLINICAL_ENGINE_VERSION, TARGET_PROFILES, MIN_REQUIRED_READINGS, GLUCOSE_MIN_MGDL, GLUCOSE_MAX_MGDL, normalizeGlucoseValues, roundUnits, roundEven, normalizeTargetA1c, targetProfile, assessInsulinSensitivity,',
              1
          )
          p.write_text(text, encoding='utf-8')

          # --- app.js: validate engine result and user inputs before rendering a clinical recommendation ---
          p = Path('app.js'); text = p.read_text(encoding='utf-8')
          text = text.replace(
              '    const resultado = clinicalEngine.calculateInitialDose({ weightKg: peso, factor, scheme: data.esquemaInicio });\n    state.patch({ am: resultado.am, pm: resultado.pm, dosisKg: resultado.dosePerKg });',
              '    const resultado = clinicalEngine.calculateInitialDose({ weightKg: peso, factor, scheme: data.esquemaInicio });\n    if (resultado.valid === false) {\n      alert("No fue posible calcular una dosis inicial segura con los datos ingresados. Revise peso, esquema y factor antes de continuar.");\n      return undefined;\n    }\n    state.patch({ am: resultado.am, pm: resultado.pm, dosisKg: resultado.dosePerKg });',
              1
          )
          text = text.replace(
              '    if (tipo === "2" && am <= 0 && pm <= 0) { alert("Ingrese al menos una dosis actual de insulina."); return undefined; }',
              '    if (tipo === "2" && (am <= 0 || pm <= 0)) { alert("Para un esquema AM + PM ingrese ambas dosis actuales."); return undefined; }',
              1
          )
          text = text.replace(
              '    const ayunasRaw = all(".ay").map((input) => parseInt(input.value, 10)).filter(Number.isFinite);\n    const preLunchRaw = all(".pre").map((input) => parseInt(input.value, 10)).filter(Number.isFinite);\n\n    if (ayunasRaw.length < 3)',
              '    const ayunasRaw = all(".ay").map((input) => parseInt(input.value, 10)).filter(Number.isFinite);\n    const preLunchRaw = all(".pre").map((input) => parseInt(input.value, 10)).filter(Number.isFinite);\n    const glicemiasInvalidas = [...ayunasRaw, ...preLunchRaw].filter((value) => !Number.isInteger(value) || value < clinicalEngine.GLUCOSE_MIN_MGDL || value > clinicalEngine.GLUCOSE_MAX_MGDL);\n    if (glicemiasInvalidas.length) { alert(`Revise las glicemias ingresadas. Para titulación automática se aceptan valores enteros entre ${clinicalEngine.GLUCOSE_MIN_MGDL} y ${clinicalEngine.GLUCOSE_MAX_MGDL} mg/dL.`); return undefined; }\n\n    if (ayunasRaw.length < 3)',
              1
          )
          text = text.replace(
              '    const resultado = clinicalEngine.calculateFollowup({\n      weightKg: peso, regimenType: tipo, amDose: am, pmDose: pm,\n      fastingValues: ayunasRaw, preLunchValues: preLunchRaw, targetA1c\n    });\n\n    state.patch({',
              '    const resultado = clinicalEngine.calculateFollowup({\n      weightKg: peso, regimenType: tipo, amDose: am, pmDose: pm,\n      fastingValues: ayunasRaw, preLunchValues: preLunchRaw, targetA1c\n    });\n    if (resultado.inputValid === false || resultado.dataSufficient === false) {\n      alert((resultado.validationErrors || []).join("\\n") || "Insulog bloqueó la titulación por datos insuficientes o inválidos.");\n      return undefined;\n    }\n\n    state.patch({',
              1
          )
          text = text.replace('if (target.id === "am-actual" || target.id === "pm-actual") sanitizeNumericInput(target, 2, 99);', 'if (target.id === "am-actual" || target.id === "pm-actual") sanitizeNumericInput(target, 3, 150);', 1)
          text = text.replace('    version: "2026.09.14-clinical-r2",\n    notes:', '    version: "2026.09.14-clinical-r2",\n    clinicalVersion: "APS-NPH-2026.09.14-r2",\n    notes:', 1)
          p.write_text(text, encoding='utf-8')

          # --- app-shell.js: action exceptions fail closed instead of console-only ---
          p = Path('app-shell.js'); text = p.read_text(encoding='utf-8')
          text = text.replace(
              '        if (result && typeof result.catch === "function") result.catch((error) => console.error(`Error ejecutando acción ${action}:`, error));\n      } catch (error) {\n        console.error(`Error ejecutando acción ${action}:`, error);\n      }',
              '        if (result && typeof result.catch === "function") result.catch((error) => {\n          console.error(`Error ejecutando acción ${action}:`, error);\n          window.InsulogSafetyGuard?.reportActionError(action, error);\n        });\n      } catch (error) {\n        console.error(`Error ejecutando acción ${action}:`, error);\n        window.InsulogSafetyGuard?.reportActionError(action, error);\n      }',
              1
