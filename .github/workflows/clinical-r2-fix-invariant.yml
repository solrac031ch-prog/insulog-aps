name: Clinical r2 invariant hotfix

on:
  push:
    branches: [clinical-alignment-r2]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove forbidden browser-token false positive and sync release
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('clinical-engine.js')
          s = p.read_text(encoding='utf-8')
          old = 'No se documenta un criterio suficiente de insulinización en el algoritmo.'
          new = 'No se registra un criterio suficiente de insulinización en el algoritmo.'
          if old not in s:
              raise SystemExit('Expected text not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          python scripts/app_shell_release.py --write
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clinical-engine.js index.html pdf-preview.html sw.js
          git commit -m "Clinical r2: corregir falso positivo de invariante y release"
          git push
