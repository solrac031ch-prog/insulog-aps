name: Document preparation and PDF preview checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "index.html"
      - "pdf-preview.html"
      - "document-flow.js"
      - "document-flow.css"
      - "sw.js"
      - ".github/workflows/document-flow-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate document flow JavaScript
        run: node --check document-flow.js

      - name: Validate isolated P6 to P7 document flow
        shell: python
        run: |
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          preview = Path("pdf-preview.html").read_text(encoding="utf-8")
          js = Path("document-flow.js").read_text(encoding="utf-8")
          css = Path("document-flow.css").read_text(encoding="utf-8")
          sw = Path("sw.js").read_text(encoding="utf-8")

          p6 = html.split('id="p6"', 1)[1].split('id="p7"', 1)[0]
          p7 = html.split('id="p7"', 1)[1].split('</section>', 1)[0]
          main_end = html.index('</main>')

          if 'id="pdf"' in p6:
              raise SystemExit("P6 must stop at the three document buttons")
          if p6.count('data-action="show-document"') != 3:
              raise SystemExit("P6 must contain exactly three declarative document actions")
          if 'id="pdf"' in p7:
              raise SystemExit("P7 must not render the PDF in the parent document")
          if 'id="pdf-preview-frame"' not in p7:
              raise SystemExit("P7 must own the isolated preview iframe")
          if html.index('id="pdf"') < main_end:
              raise SystemExit("Parent PDF staging node must live outside the application main")
          if 'onclick=' in html:
              raise SystemExit("Document flow must not depend on inline JavaScript")

          for marker in [
              'data-action="print-document"', 'id="imprimir-documento-btn"',
              './pdf-preview.html?v=20260910-1', 'pdf-render-staging'
          ]:
              if marker not in html:
                  raise SystemExit(f"Missing isolated document host marker: {marker}")

          for marker in [
              'const documents = window.InsulogDocuments',
              'actions.register("show-document"', 'go(7)',
              'Ingrese el nombre del paciente antes de generar el documento.',
              'documents.generate(tipo)', 'actions.register("back-document"',
              'copiarVistaPreviaAlFrame', 'contentDocument', 'queueMicrotask',
              'actions.register("print-document"', 'frame.contentWindow?.print()',
              'actions.decorate("finish"'
          ]:
              if marker not in js:
                  raise SystemExit(f"Missing isolated document behavior: {marker}")

          for forbidden in [
              'window.mostrarDocumento', 'window.generarDocumento', 'window.volverPreparacionDocumento',
              'window.imprimirDocumentoAislado', 'window.finalizar', 'globalData'
          ]:
              if forbidden in js:
                  raise SystemExit(f"Legacy document global returned: {forbidden}")

          for marker in [
              '.pdf-preview-frame-shell', '.pdf-preview-frame', '.pdf-render-staging',
              'body.pdf-isolated-document', '#pdf.pdf-carta-una-pagina',
              'size: Letter portrait', 'margin: 0.35cm',
              'height: 17.2px !important', 'height: 17.8px !important',
              'height: 16.4px !important'
          ]:
              if marker not in css:
                  raise SystemExit(f"Missing isolated preview/Letter rule: {marker}")

          for forbidden in ['zoom: 0.92', 'width: 108.7%']:
              if forbidden in css:
                  raise SystemExit(f"PDF must not use distortion workaround: {forbidden}")

          for asset in [
              './styles.css?v=20260910-1',
              './pdf-enhancements.css?v=20260827-4',
              './pdf-design-2026.css?v=20260827-1',
              './document-flow.css?v=20260910-1'
          ]:
              if f'href="{asset}"' not in preview:
                  raise SystemExit(f"Isolated preview asset missing: {asset}")

          if 'href="./pdf-enhancements.css' in html or 'href="./pdf-design-2026.css' in html:
              raise SystemExit("PDF presentation CSS must not load in the parent application")

          for asset in [
              './pdf-preview.html?v=20260910-1',
              './document-flow.css?v=20260910-1',
              './document-flow.js?v=20260910-2'
          ]:
              if asset not in sw:
                  raise SystemExit(f"Current isolated document asset missing from app shell: {asset}")

          if 'const CACHE_NAME = "insulog-shell-20260910-atomic23"' not in sw:
              raise SystemExit("Phase 7 visual shell must ship with a fresh PWA cache")

          print("P6/P7 explicit-action preview and one-page Letter checks passed")
