name: Refresh release once

on:
  push:
    paths:
      - .github/workflows/refresh-release-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh canonical app-shell release
        run: python scripts/app_shell_release.py --write

      - name: Commit release fingerprint and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-release-once.yml
          git add index.html pdf-preview.html sw.js
          git commit -m "Chore: refrescar huella PWA tras ajuste visual"
          git push origin HEAD:main
