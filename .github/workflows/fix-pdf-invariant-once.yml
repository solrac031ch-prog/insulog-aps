name: Fix PDF isolation invariant once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-pdf-invariant-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update PDF isolation invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/check_invariants.py')
          s = p.read_text(encoding='utf-8')

          old_assets = '''require(
              pdf_preview_html,
              [asset("styles.css"), asset("document-flow.css"), asset("pdf-enhancements.css"), asset("pdf-design-2026.css"), 'id="pdf"'],
              "Isolated PDF document assets",
          )
          '''
          new_assets = '''require(
              pdf_preview_html,
              [asset("document-flow.css"), asset("pdf-enhancements.css"), asset("pdf-design-2026.css"), 'id="pdf"'],
              "Isolated PDF document assets",
          )
          forbid(pdf_preview_html, ['href="./styles.css'], "Isolated PDF global application stylesheet")
          '''
          if old_assets not in s:
              raise SystemExit('PDF asset invariant target not found')
          s = s.replace(old_assets, new_assets)

          old_reference = '        "ADA 2026", "function bloqueControlFirma", "pdf-doc-title", "pdf-patient-row",\n'
          new_reference = '        "Vía Clínica MINSAL DM2 2026", "Protocolo de Insulinización MINSAL 2022", "function bloqueControlFirma", "pdf-doc-title", "pdf-patient-row",\n'
          if old_reference not in s:
              raise SystemExit('Patient document reference invariant target not found')
          s = s.replace(old_reference, new_reference)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate invariants
        run: python scripts/check_invariants.py
      - name: Commit invariant update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_invariants.py
          git commit -m "Align PDF invariants with isolated MINSAL document"
          git push
