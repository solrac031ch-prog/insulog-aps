name: Insulog E2E safety net

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.css"
      - "manifest.webmanifest"
      - "sw.js"
      - "package.json"
      - "playwright.config.js"
      - "tests/e2e/**"
      - ".github/workflows/e2e-safety-net.yml"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.css"
      - "manifest.webmanifest"
      - "sw.js"
      - "package.json"
      - "playwright.config.js"
      - "tests/e2e/**"
      - ".github/workflows/e2e-safety-net.yml"

permissions:
  contents: read

concurrency:
  group: insulog-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VISUAL_RECORD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Insulog browser safety net
        run: npm run test:e2e

      - name: Upload visual contract captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insulog-visual-contract
          path: test-results/**/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: insulog-playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
