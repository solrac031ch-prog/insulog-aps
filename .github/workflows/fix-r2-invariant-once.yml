name: Fix r2 invariant once

on:
  push:
    paths:
      - .github/workflows/fix-r2-invariant-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align invariant with ternary percentage rule
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('scripts/check_invariants.py')
          s = p.read_text(encoding='utf-8')
          pattern = r'"percent = -20",\s*"percent = -10",'
          s2, n = re.subn(pattern, '"analysis.hipo ? -20 : -10",', s, count=1)
          if n != 1:
              raise SystemExit('Expected percentage invariant tokens not found')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Verify invariants locally
        run: python scripts/check_invariants.py
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_invariants.py
          git rm .github/workflows/fix-r2-invariant-once.yml
          git commit -m "Chore: align clinical r2 invariant with percentage rule"
          git push
# trigger 3
