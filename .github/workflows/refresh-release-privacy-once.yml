name: Refresh privacy release once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-release-privacy-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh canonical PWA release
        run: python scripts/app_shell_release.py --write
      - name: Validate
        run: |
          node --check phase6b-document-sync.js
          npm run check:clinical-protocol
          npm run test:clinical-copy
          npm run test:note-presenter
          npm run check:invariants
          npm run check:release
      - name: Commit release and cleanup workflow
        run: |
          rm .github/workflows/refresh-release-privacy-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pdf-preview.html sw.js .github/workflows/refresh-release-privacy-once.yml
          git commit -m "Refresh PWA release after patient privacy update"
          git push origin HEAD:main
