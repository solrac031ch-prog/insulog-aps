name: Sync Farmacia Popular Cerro Navia

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_farmacia_cerro_navia.py"
      - ".github/workflows/sync-farmacia-cerro-navia.yml"

permissions:
  contents: write

concurrency:
  group: farmacia-popular-cerro-navia
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Fetch current prices and stock
        run: python scripts/update_farmacia_cerro_navia.py

      - name: Commit updated pharmacy data
        run: |
          if git diff --quiet -- data/farmacia-cerro-navia.json; then
            echo "No pharmacy data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/farmacia-cerro-navia.json
          git commit -m "Update Cerro Navia pharmacy prices"
          git push
