name: Sync Farmacia Popular Cerro Navia

on:
  schedule:
    # GitHub Actions schedule es best-effort. Se programan varios intentos UTC
    # para cubrir la madrugada/mañana de Chile incluso si alguno se retrasa.
    - cron: "30 7,8,9,10,13 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_farmacia_cerro_navia.py"
      - ".github/workflows/sync-farmacia-cerro-navia.yml"

permissions:
  contents: write

concurrency:
  group: farmacia-popular-cerro-navia
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skip scheduled retry if data is already current today
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          chile = ZoneInfo("America/Santiago")
          today_chile = datetime.now(chile).date()
          path = Path("data/farmacia-cerro-navia.json")
          updated_chile = None
          current_today = False

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
              raw = str(data.get("updated_at") or "").strip()
              if raw:
                  updated = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  if updated.tzinfo is None:
                      updated = updated.replace(tzinfo=timezone.utc)
                  updated_chile = updated.astimezone(chile).date()
                  current_today = updated_chile == today_chile
          except Exception as exc:
              print(f"Could not determine pharmacy data freshness: {exc}")

          # Solo los intentos automáticos se omiten si ya hubo una actualización
          # ese día. workflow_dispatch y push siguen ejecutándose como prueba/rescate.
          skip = os.environ.get("EVENT_NAME") == "schedule" and current_today

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"skip={'true' if skip else 'false'}\n")
              output.write(f"today_chile={today_chile.isoformat()}\n")
              output.write(f"updated_chile={updated_chile.isoformat() if updated_chile else 'unknown'}\n")

          if skip:
              print(f"Pharmacy data is already current for Chile date {today_chile}; scheduled retry skipped.")
          else:
              print(
                  "Pharmacy sync will run:",
                  f"event={os.environ.get('EVENT_NAME')}",
                  f"today_chile={today_chile}",
                  f"updated_chile={updated_chile}",
              )
          PY

      - name: Install scraper dependencies
        if: steps.freshness.outputs.skip != 'true'
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Fetch current prices, stock and new presentations
        if: steps.freshness.outputs.skip != 'true'
        run: python scripts/update_farmacia_cerro_navia.py

      - name: Validate generated pharmacy data
        if: steps.freshness.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/farmacia-cerro-navia.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("status") != "ok":
              raise SystemExit("Pharmacy JSON status is not ok")
          if data.get("schema_version") != 2:
              raise SystemExit("Unexpected pharmacy JSON schema")
          if int(data.get("base_rows", 0)) < 5 or int(data.get("source_rows", 0)) < 1:
              raise SystemExit("Pharmacy source looks incomplete")
          if not isinstance(data.get("medications"), dict):
              raise SystemExit("Missing medications map")
          discovery = data.get("discovery") or {}
          if not isinstance(discovery.get("unrecognized_presentations"), list):
              raise SystemExit("Missing discovery safety net")
          print(
              "Validated pharmacy data:",
              data.get("updated_at"),
              "source_rows=", data.get("source_rows"),
              "review=", len(discovery.get("unrecognized_presentations", [])),
          )
          PY

      - name: Commit updated pharmacy data safely
        if: steps.freshness.outputs.skip != 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # main puede avanzar mientras corre la consulta (por ejemplo, durante un merge).
          # Si el push es rechazado, se toma el main más reciente, se consulta de nuevo
          # la fuente y se reintenta sin perder la actualización diaria.
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "Retry $attempt/3 against latest main"
              git fetch origin main
              git reset --hard origin/main
              python scripts/update_farmacia_cerro_navia.py
            fi

            if git diff --quiet -- data/farmacia-cerro-navia.json; then
              echo "No pharmacy data changes to commit."
              exit 0
            fi

            git add data/farmacia-cerro-navia.json
            git commit -m "Update Cerro Navia pharmacy prices"

            if git push origin HEAD:main; then
              echo "Pharmacy data published successfully."
              exit 0
            fi

            echo "Push attempt $attempt failed; retrying with latest main."
            sleep 5
          done

          echo "Could not publish pharmacy data after 3 attempts." >&2
          exit 1
