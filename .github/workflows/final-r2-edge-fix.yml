name: Final clinical r2 edge fix

on:
  push:
    paths:
      - .github/workflows/final-r2-edge-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restrict high-dose screen to actual basal ceiling block
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')
          old = 'if (resultado.requiresHighDoseReview) { go(41); return resultado; }'
          new = 'if (resultado.blocksAutomaticEscalation || resultado.doseSafety?.level === "stop") { go(41); return resultado; }'
          if old not in text:
              raise SystemExit('Expected app.js high-dose route not found')
          app.write_text(text.replace(old, new, 1), encoding='utf-8')

          inv = Path('scripts/check_invariants.py')
          text = inv.read_text(encoding='utf-8')
          old = '"resultado.requiresHighDoseReview", "minAy", "minPre",'
          new = '"resultado.blocksAutomaticEscalation", "minAy", "minPre",'
          if old not in text:
              raise SystemExit('Expected invariant token not found')
          inv.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Regenerate canonical app-shell release
        run: python scripts/app_shell_release.py --write
      - name: Commit final r2 edge fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js scripts/check_invariants.py index.html pdf-preview.html sw.js
          git rm .github/workflows/final-r2-edge-fix.yml
          git commit -m "Clinical r2: route high-dose review only at basal ceiling"
          git push
