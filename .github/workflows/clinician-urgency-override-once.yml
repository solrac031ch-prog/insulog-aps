name: Clinician urgency override once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/clinician-urgency-override-once.yml

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply clinician override patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('phase6b-professional-decision.js')
          text = path.read_text(encoding='utf-8')

          old = '''  function setReviewStatus(message, ok = true) {
            const node = byId("best-review-status");
            if (!node) return;
            node.textContent = message;
            node.style.color = ok ? "var(--success)" : "var(--danger)";
          }'''
          new = '''  function setReviewStatus(message, tone = true) {
            const node = byId("best-review-status");
            if (!node) return;
            node.textContent = message;
            node.style.color = tone === "warning"
              ? "var(--warning, #8a5a00)"
              : (tone === false || tone === "danger" ? "var(--danger)" : "var(--success)");
          }'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''      } else {
                summary.innerHTML = `<strong>Decisión final:</strong> ${notePresenter.escapeHTML(decisionLabel(decision))}<br><strong>Pauta final:</strong> ${notePresenter.escapeHTML(doseText(data.professionalAm, data.professionalPm))}` +
                  (decision === "modificada" ? `<br><strong>Motivo:</strong> ${notePresenter.escapeHTML(data.professionalReason || "")}` : "");
              }
            }

            if (!decision) setReviewStatus("Revisión profesional aún no registrada.", true);
            if (decision === "aceptada") setReviewStatus("✓ Recomendación revisada y aceptada por el profesional.", true);
            if (decision === "modificada") setReviewStatus("✓ Plan modificado y documentado como decisión profesional.", true);
            if (decision === "reevaluar") setReviewStatus("Recomendación marcada para reevaluación clínica; no se emitirá documento con nueva pauta.", false);'''
          new = '''      } else {
                const urgencyNotice = decision === "modificada" && caseType(baseClinicalNote || rawNote()) === "urgencia"
                  ? '<br><strong>Alerta Clinical r2:</strong> se detectó un criterio de urgencia; la pauta continúa por decisión profesional documentada.'
                  : "";
                summary.innerHTML = `<strong>Decisión final:</strong> ${notePresenter.escapeHTML(decisionLabel(decision))}<br><strong>Pauta final:</strong> ${notePresenter.escapeHTML(doseText(data.professionalAm, data.professionalPm))}` +
                  (decision === "modificada" ? `<br><strong>Motivo:</strong> ${notePresenter.escapeHTML(data.professionalReason || "")}` : "") + urgencyNotice;
              }
            }

            if (!decision) setReviewStatus("Revisión profesional aún no registrada.", true);
            if (decision === "aceptada") setReviewStatus("✓ Recomendación revisada y aceptada por el profesional.", true);
            if (decision === "modificada" && caseType(baseClinicalNote || rawNote()) !== "urgencia") setReviewStatus("✓ Plan modificado y documentado como decisión profesional.", true);
            if (decision === "modificada" && caseType(baseClinicalNote || rawNote()) === "urgencia") setReviewStatus("⚠ Clinical r2 detectó un criterio de urgencia. Se conserva la alerta, pero prevalece la pauta modificada por el profesional con justificación documentada.", "warning");
            if (decision === "reevaluar") setReviewStatus("Recomendación marcada para reevaluación clínica; no se emitirá documento con nueva pauta.", false);'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    if (helper) helper.textContent = "Clinical r2 mantiene su recomendación original. El profesional puede aceptarla, modificar la pauta dejando un motivo, o indicar reevaluación. La decisión profesional queda separada del cálculo del algoritmo.";'''
          new = '''    if (helper) helper.textContent = "Clinical r2 mantiene su recomendación original y sus alertas de seguridad. El profesional puede aceptarla, modificar la pauta dejando un motivo, o indicar reevaluación. Una alerta del algoritmo nunca sustituye el criterio clínico documentado del profesional.";'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''  function validateModifiedPlan(am, pm, reason) {
            if (caseType(baseClinicalNote || rawNote()) === "urgencia") throw new Error("En una ruta de urgencia no se permite emitir una pauta manual de NPH desde Insulog.");
            if (!Number.isInteger(am) || !Number.isInteger(pm) || am < 0 || pm < 0 || am > 150 || pm > 150) throw new Error("Ingrese dosis AM y PM enteras entre 0 y 150 UI.");'''
          new = '''  function validateModifiedPlan(am, pm, reason) {
            if (!Number.isInteger(am) || !Number.isInteger(pm) || am < 0 || pm < 0 || am > 150 || pm > 150) throw new Error("Ingrese dosis AM y PM enteras entre 0 y 150 UI.");'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''  function openModifyPanel() {
            syncBaseClinicalNote();
            if (!baseClinicalNote) return;
            if (caseType(baseClinicalNote) === "urgencia") {
              setReviewStatus("La ruta de urgencia no admite modificación manual de dosis en Insulog.", false);
              return;
            }
            const recommendation = currentRecommendation();'''
          new = '''  function openModifyPanel() {
            syncBaseClinicalNote();
            if (!baseClinicalNote) return;
            if (caseType(baseClinicalNote) === "urgencia") {
              setReviewStatus("⚠ Clinical r2 detectó un criterio de urgencia. Puede modificar la pauta por criterio profesional; la justificación quedará registrada y la alerta original se conservará.", "warning");
            }
            const recommendation = currentRecommendation();'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    } else if (data.professionalDecision === "modificada") {
              lines.push(`Decisión final del profesional: Modificada (${doseText(data.professionalAm, data.professionalPm)}).`);
              lines.push(`Motivo de modificación: ${String(data.professionalReason || "").trim()}`);
            } else if (data.professionalDecision === "reevaluar") {'''
          new = '''    } else if (data.professionalDecision === "modificada") {
              lines.push(`Decisión final del profesional: Modificada (${doseText(data.professionalAm, data.professionalPm)}).`);
              lines.push(`Motivo de modificación: ${String(data.professionalReason || "").trim()}`);
              if (caseType(baseClinicalNote || rawNote()) === "urgencia") {
                lines.push("Advertencia Insulog: Clinical r2 había activado una ruta de urgencia; el profesional decide una pauta alternativa con justificación clínica documentada.");
              }
            } else if (data.professionalDecision === "reevaluar") {'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''  function canGeneratePatientDocument() {
            syncBaseClinicalNote();
            const decision = state.get("professionalDecision");
            if (caseType(baseClinicalNote || rawNote()) === "urgencia") {
              alert("Este caso está en una ruta de urgencia. No se debe generar una nueva pauta ambulatoria de NPH desde Insulog.");
              return false;
            }
            if (decision !== "aceptada" && decision !== "modificada") {'''
          new = '''  function canGeneratePatientDocument() {
            syncBaseClinicalNote();
            const decision = state.get("professionalDecision");
            if (caseType(baseClinicalNote || rawNote()) === "urgencia" && decision !== "modificada") {
              alert("Clinical r2 mantiene una alerta de urgencia. Si el profesional decide emitir una pauta ambulatoria distinta, use MODIFICAR PLAN y registre la justificación clínica.");
              return false;
            }
            if (decision !== "aceptada" && decision !== "modificada") {'''
          assert old in text
          text = text.replace(old, new, 1)

          text = text.replace('window.InsulogPhase6B = Object.freeze({ version: "2026.09.14-phase6b", qualitySnapshot, canGeneratePatientDocument });',
                              'window.InsulogPhase6B = Object.freeze({ version: "2026.09.15-phase6b-clinician-override", qualitySnapshot, canGeneratePatientDocument });', 1)
          path.write_text(text, encoding='utf-8')

          path = Path('phase6b-document-sync.js')
          text = path.read_text(encoding='utf-8')
          old = '''  function currentWeightInput() {
            const note = String(rawClinicalNote()).trim();
            const id = /^INICIO\\b/i.test(note) ? "peso-paciente" : "peso-seguimiento";
            return document.getElementById(id);
          }'''
          new = '''  function currentWeightInput() {
            const inicio = document.getElementById("peso-paciente");
            const seguimiento = document.getElementById("peso-seguimiento");
            if (safeNumber(seguimiento?.value) > 0) return seguimiento;
            if (safeNumber(inicio?.value) > 0) return inicio;
            const note = String(rawClinicalNote()).trim();
            return /^INICIO\\b/i.test(note) ? inicio : (seguimiento || inicio);
          }'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''      && reason.length >= 5
              && weight !== null
              && weight > 0
              && !isUrgencyRoute();'''
          new = '''      && reason.length >= 5
              && weight !== null
              && weight > 0;'''
          assert old in text
          text = text.replace(old, new, 1)

          text = text.replace('// si existe justificación clínica documentada. La ruta de urgencia continúa bloqueada.',
                              '// si existe justificación clínica documentada. Las alertas de urgencia se conservan, pero no anulan una decisión profesional explícita.', 1)
          text = text.replace('version: "2026.09.14-phase6b-document-sync-professional-override"',
                              'version: "2026.09.15-phase6b-document-sync-clinician-override"', 1)
          path.write_text(text, encoding='utf-8')

          path = Path('docs/phase6b-professional-decision.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('`REEVALUAR` y las rutas de urgencia no permiten emitir una nueva pauta ambulatoria desde esta capa.',
                              '`REEVALUAR` no permite emitir una nueva pauta ambulatoria. Si Clinical r2 activa una ruta de urgencia, `ACEPTAR` conserva esa conducta; `MODIFICAR PLAN` permite al profesional registrar y emitir una pauta alternativa siempre que deje una justificación clínica explícita. La alerta original permanece visible y documentada.')
          text = text.replace('El umbral de 0,5 UI/kg/día sigue siendo un guardrail para la recomendación automática. Una pauta manual >0,5 UI/kg/día puede registrarse y emitirse cuando el profesional la modifica de forma explícita y deja una justificación clínica; Insulog mantiene una advertencia visible y documenta que se trata de una excepción por criterio profesional. Las rutas de urgencia siguen bloqueadas.',
                              'El umbral de 0,5 UI/kg/día y las rutas de urgencia siguen siendo guardrails de la recomendación automática. No son bloqueos absolutos de la decisión médica: una pauta manual puede apartarse de ellos cuando el profesional usa `MODIFICAR PLAN` y deja una justificación clínica explícita. Insulog mantiene las advertencias originales y documenta claramente la excepción por criterio profesional.')
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/e2e/phase6b-urgency-professional-override.spec.js')
          test_path.write_text(r'''const { test, expect } = require("@playwright/test");

async function expectActivePage(page, id) {
  const section = page.locator(`#${id}`);
  await expect(section).toHaveClass(/(^|\s)active(\s|$)/);
  await expect(section).toHaveAttribute("aria-hidden", "false");
}

async function openFollowupResult(page) {
  await page.goto("/");
  await page.locator("#p0").getByRole("button", { name: "INICIAR ALGORITMO", exact: true }).click();
  await page.locator("#p1").getByRole("button", { name: "NO", exact: true }).click();
  await page.locator("#p2").getByRole("button", { name: "SEGUIMIENTO DE INSULINA", exact: true }).click();
  await page.locator("#p35").getByRole("button", { name: "CONTINUAR AL REGISTRO DE GLICEMIAS", exact: true }).click();
  await expectActivePage(page, "p4");

  await page.locator("#peso-seguimiento").fill("70");
  await page.locator("#tipo-esquema").selectOption("2");
  await page.locator("#am-actual").fill("12");
  await page.locator("#pm-actual").fill("12");
  const fasting = page.locator("#tabla-seguimiento .ay");
  const pre = page.locator("#tabla-seguimiento .pre");
  for (let i = 0; i < 3; i += 1) {
    await fasting.nth(i).fill("100");
    await pre.nth(i).fill("100");
  }
  await page.locator("#ajustar-seguimiento-btn").click();
  await expectActivePage(page, "p5");

  await page.evaluate(() => {
    const note = document.getElementById("nota-clinica");
    const urgent = "SEGUIMIENTO NPH\nHIPOGLICEMIA NIVEL 3: Clinical r2 recomienda evaluación urgente.\nDosis sugerida AM 12 UI · PM 12 UI.";
    note.dataset.rawText = urgent;
    note.textContent = urgent;
  });
}

test("criterio profesional puede modificar y emitir pauta aunque Clinical r2 marque urgencia", async ({ page }) => {
  await openFollowupResult(page);

  await page.locator("#best-review-modify").click();
  await expect(page.locator("#best-modify-panel")).toBeVisible();
  await expect(page.locator("#best-review-status")).toContainText("Puede modificar la pauta por criterio profesional");

  await page.locator("#best-final-am").fill("14");
  await page.locator("#best-final-pm").fill("12");
  await page.locator("#best-modify-reason").fill("Criterio clínico del médico tratante tras reevaluación presencial del paciente");
  await page.getByRole("button", { name: "GUARDAR DECISIÓN", exact: true }).click();

  const state = await page.evaluate(() => window.InsulogRuntime.state.snapshot());
  expect(state.professionalDecision).toBe("modificada");
  expect(state.professionalAm).toBe(14);
  expect(state.professionalPm).toBe(12);
  await expect(page.locator("#best-review-status")).toContainText("prevalece la pauta modificada por el profesional");
  await expect(page.locator("#nota-clinica")).toContainText("Clinical r2 había activado una ruta de urgencia");

  await page.locator("#p5").getByRole("button", { name: "SEGUIMIENTO Y AJUSTE", exact: true }).click();
  await expectActivePage(page, "p6");
});
''', encoding='utf-8')
          PY

      - name: Refresh canonical PWA release
        run: python scripts/app_shell_release.py --write

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax and invariant checks
        run: |
          node --check phase6b-professional-decision.js
          node --check phase6b-document-sync.js
          npm run check:clinical-protocol
          npm run test:clinical-copy
          npm run test:note-presenter
          npm run check:invariants
          npm run check:release

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Focused Phase 6B browser tests
        run: npx playwright test tests/e2e/phase6b-urgency-professional-override.spec.js tests/e2e/phase6b-overbasal-professional-override.spec.js tests/e2e/phase6b-professional-decision.spec.js --project=chromium

      - name: Commit validated change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase6b-professional-decision.js phase6b-document-sync.js docs/phase6b-professional-decision.md tests/e2e/phase6b-urgency-professional-override.spec.js index.html pdf-preview.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Let documented clinician judgment override urgency guardrail"
          git push
