name: Temporary PDF isolation migration

on:
  push:
    branches: [isolate-pdf-preview]
    paths:
      - "scripts/migrate_pdf_isolation.py"
      - ".github/workflows/migrate-pdf-isolation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: isolate-pdf-preview

      - name: Apply deterministic migration
        run: python scripts/migrate_pdf_isolation.py

      - name: Commit migrated application files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js tests/e2e/insulog.spec.js scripts/check_invariants.py
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "Isolate patient PDF from application UI"
          git push origin HEAD:isolate-pdf-preview
