name: Add local history once

on:
  push:
    paths:
      - .github/workflows/add-local-history-once.yml

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Add local longitudinal history layer
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')

          history_js = r'''"use strict";

(function exposeLocalHistory(root, factory) {
  const api = factory();
  if (typeof module === "object" && module.exports) module.exports = api;
  if (root?.document) {
    root.document.addEventListener("DOMContentLoaded", () => api.mount(root), { once: true });
  }
})(typeof globalThis !== "undefined" ? globalThis : this, () => {
  const STORAGE_KEY = "insulog.history.v1";
  const MAX_ENTRIES = 100;

  function asText(value, max = 4000) {
    return String(value ?? "").trim().slice(0, max);
  }

  function asNumber(value) {
    const number = Number(value);
    return Number.isFinite(number) ? number : null;
  }

  function asDose(value) {
    const number = Number(value);
    return Number.isFinite(number) && number >= 0 ? Math.round(number) : null;
  }

  function asValues(values) {
    return Array.isArray(values)
      ? values.map(Number).filter(Number.isFinite).map((value) => Math.round(value)).slice(0, 30)
      : [];
  }

  function normalizeType(value) {
    return ["inicio", "seguimiento", "urgencia"].includes(value) ? value : "seguimiento";
  }

  function normalizeEntry(input = {}, { id, savedAt } = {}) {
    return Object.freeze({
      id: asText(id || input.id, 80),
      savedAt: asText(savedAt || input.savedAt, 40),
      alias: asText(input.alias, 60) || "Sin alias",
      type: normalizeType(input.type),
      appVersion: asText(input.appVersion, 80),
      weightKg: asNumber(input.weightKg),
      targetA1c: asNumber(input.targetA1c),
      regimenType: asText(input.regimenType, 30),
      previousDose: Object.freeze({ am: asDose(input.previousDose?.am), pm: asDose(input.previousDose?.pm) }),
      recommendedDose: Object.freeze({ am: asDose(input.recommendedDose?.am), pm: asDose(input.recommendedDose?.pm) }),
      dosePerKg: asNumber(input.dosePerKg),
      fastingValues: Object.freeze(asValues(input.fastingValues)),
      preLunchValues: Object.freeze(asValues(input.preLunchValues)),
      minFasting: asNumber(input.minFasting),
      minPreLunch: asNumber(input.minPreLunch),
      criteria: asText(input.criteria, 1500),
      scheme: asText(input.scheme, 500),
      explanation: asText(input.explanation, 2500),
      treatment: asText(input.treatment, 1500),
      note: asText(input.note, 7000)
    });
  }

  function defaultId() {
    if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") return crypto.randomUUID();
    return `hist-${Date.now()}-${Math.random().toString(16).slice(2)}`;
  }

  function createStore(storage, { now = () => new Date(), idFactory = defaultId } = {}) {
    if (!storage || typeof storage.getItem !== "function" || typeof storage.setItem !== "function") {
      throw new Error("Almacenamiento local no disponible");
    }

    function list() {
      try {
        const parsed = JSON.parse(storage.getItem(STORAGE_KEY) || "[]");
        if (!Array.isArray(parsed)) return [];
        return parsed
          .filter((item) => item && typeof item === "object" && item.id && item.savedAt)
          .map((item) => normalizeEntry(item))
          .sort((a, b) => String(b.savedAt).localeCompare(String(a.savedAt)));
      } catch {
        return [];
      }
    }

    function write(entries) {
      storage.setItem(STORAGE_KEY, JSON.stringify(entries.slice(0, MAX_ENTRIES)));
    }

    function save(record) {
      const entry = normalizeEntry(record, {
        id: idFactory(),
        savedAt: now().toISOString()
      });
      const entries = [entry, ...list().filter((item) => item.id !== entry.id)].slice(0, MAX_ENTRIES);
      write(entries);
      return entry;
    }

    function remove(id) {
      const next = list().filter((entry) => entry.id !== id);
      write(next);
      return next;
    }

    function clear() {
      if (typeof storage.removeItem === "function") storage.removeItem(STORAGE_KEY);
      else write([]);
    }

    return Object.freeze({ list, save, remove, clear });
  }

  function getBrowserStorage(root) {
    try {
      return root.localStorage;
    } catch {
      return null;
    }
  }

  function mount(root) {
    const runtime = root.InsulogRuntime;
    const app = root.InsulogApp;
    if (!runtime || !app) return;

    const storage = getBrowserStorage(root);
    let store = null;
    try {
      if (storage) store = createStore(storage);
    } catch {
      store = null;
    }

    const { go } = runtime.navigation;
    const state = runtime.state;
    const actions = runtime.actions;
    const escapeHTML = app.text.escapeHTML;

    function numericValues(selector) {
      return Array.from(root.document.querySelectorAll(selector))
        .map((input) => Number.parseInt(input.value, 10))
        .filter(Number.isFinite);
    }

    function currentRecord() {
      const noteNode = root.document.getElementById("nota-clinica");
      const note = noteNode?.dataset.rawText || noteNode?.innerText || "";
      if (!note.trim()) throw new Error("No hay una nota clínica generada para guardar.");

      const data = state.snapshot();
      const urgent = /HIPOGLICEMIA NIVEL 3/i.test(note);
      const initial = /^INICIO\b/i.test(note.trim());
      const alias = root.document.getElementById("historial-alias")?.value || "";
      const weightInput = initial ? root.document.getElementById("peso-paciente") : root.document.getElementById("peso-seguimiento");

      return {
        alias,
        type: urgent ? "urgencia" : (initial ? "inicio" : "seguimiento"),
        appVersion: app.version || "",
        weightKg: weightInput?.value,
        targetA1c: data.targetA1c,
        regimenType: initial ? (data.esquemaInicio || "") : (root.document.getElementById("tipo-esquema")?.value || ""),
        previousDose: { am: data.amActual, pm: data.pmActual },
        recommendedDose: { am: data.am, pm: data.pm },
        dosePerKg: data.dosisKg,
        fastingValues: numericValues("#tabla-seguimiento .ay"),
        preLunchValues: numericValues("#tabla-seguimiento .pre"),
        minFasting: data.minAy,
        minPreLunch: data.minPre,
        criteria: data.criteria,
        scheme: data.textoEsquemaInicio,
        explanation: data.explicacion,
        treatment: data.tratamientoConcomitante,
        note
      };
    }

    function formatDose(dose) {
      const am = dose?.am;
      const pm = dose?.pm;
      const parts = [];
      if (Number.isFinite(am)) parts.push(`AM ${am} UI`);
      if (Number.isFinite(pm)) parts.push(`PM ${pm} UI`);
      return parts.length ? parts.join(" · ") : "No registrada";
    }

    function formatDate(iso) {
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return iso;
      return new Intl.DateTimeFormat("es-CL", { dateStyle: "short", timeStyle: "short" }).format(date);
    }

    function renderHistory() {
      const host = root.document.getElementById("historial-local-lista");
      if (!host) return;
      if (!store) {
        host.innerHTML = '<div class="alert alert-warning">El almacenamiento local no está disponible en este navegador.</div>';
        return;
      }

      const entries = store.list();
      if (!entries.length) {
        host.innerHTML = '<div class="card compact-card text-left"><strong>No hay registros guardados.</strong><p class="helper-text">Los casos sólo se guardan cuando usted presiona “GUARDAR EN HISTORIAL LOCAL”.</p></div>';
        return;
      }

      host.innerHTML = entries.map((entry) => {
        const typeLabel = entry.type === "inicio" ? "Inicio" : entry.type === "urgencia" ? "Urgencia / nivel 3" : "Seguimiento";
        const previous = formatDose(entry.previousDose);
        const recommended = formatDose(entry.recommendedDose);
        const glucose = entry.type === "inicio"
          ? "Inicio de insulinoterapia"
          : `Menor ayunas: ${entry.minFasting ?? "N/A"} mg/dL · Menor pre-almuerzo: ${entry.minPreLunch ?? "N/A"} mg/dL`;
        return `<article class="card compact-card text-left" data-history-entry="${escapeHTML(entry.id)}">
          <p class="card-title">${escapeHTML(entry.alias)} · ${escapeHTML(typeLabel)}</p>
          <p class="helper-text">${escapeHTML(formatDate(entry.savedAt))} · ${escapeHTML(entry.appVersion || "versión no registrada")}</p>
          <p><strong>Dosis:</strong> ${escapeHTML(previous)} → ${escapeHTML(recommended)}</p>
          <p>${escapeHTML(glucose)}</p>
          <details>
            <summary>Ver nota clínica guardada</summary>
            <pre class="nota">${escapeHTML(entry.note)}</pre>
          </details>
          <button type="button" class="btn btn-danger btn-narrow" data-action="delete-local-history" data-history-id="${escapeHTML(entry.id)}">ELIMINAR REGISTRO</button>
        </article>`;
      }).join("");
    }

    function setStatus(message, ok = true) {
      const status = root.document.getElementById("historial-local-status");
      if (!status) return;
      status.textContent = message;
      status.style.color = ok ? "var(--success)" : "var(--danger)";
    }

    function injectUI() {
      const homeStart = root.document.querySelector("#p0 .hero-action");
      if (homeStart && !root.document.getElementById("abrir-historial-local")) {
        homeStart.insertAdjacentHTML("afterend", '<button id="abrir-historial-local" type="button" class="btn btn-narrow secondary-nav" data-action="open-local-history">HISTORIAL LOCAL</button>');
      }

      const resultPage = root.document.getElementById("p5");
      const decisionCard = resultPage?.querySelector(".decision-card");
      if (resultPage && decisionCard && !root.document.getElementById("historial-local-card")) {
        decisionCard.insertAdjacentHTML("beforebegin", `
          <div id="historial-local-card" class="card compact-card text-left">
            <p class="card-title text-center">Historial longitudinal local</p>
            <div class="field">
              <label for="historial-alias">Alias / código local del paciente (opcional)</label>
              <input id="historial-alias" type="text" maxlength="60" autocomplete="off" placeholder="Ej: PX-014">
            </div>
            <p class="helper-text">Se guarda sólo en este navegador. No se sincroniza ni se envía a un servidor. Evite usar RUT o nombre completo.</p>
            <div class="stack-actions narrow-actions">
              <button type="button" class="btn btn-success" data-action="save-local-history">GUARDAR EN HISTORIAL LOCAL</button>
              <button type="button" class="btn" data-action="open-local-history">VER HISTORIAL</button>
            </div>
            <div id="historial-local-status" class="copy-status" role="status" aria-live="polite"></div>
          </div>`);
      }

      if (!root.document.getElementById("p8")) {
        const page = root.document.createElement("section");
        page.id = "p8";
        page.className = "page page-center";
        page.setAttribute("aria-hidden", "true");
        page.innerHTML = `
          <div class="page-label">Historial · almacenamiento local</div>
          <h2>Historial longitudinal local</h2>
          <p class="lead small-lead">Registros guardados manualmente en este navegador. No se sincronizan con la ficha clínica ni con un servidor.</p>
          <div id="historial-local-lista"></div>
          <button type="button" class="btn btn-danger btn-narrow section-action" data-action="clear-local-history">BORRAR TODO EL HISTORIAL LOCAL</button>
          <button type="button" class="btn btn-narrow secondary-nav" data-action="history-home">VOLVER AL INICIO</button>`;
        root.document.getElementById("app")?.appendChild(page);
      }
    }

    injectUI();

    actions.register("save-local-history", () => {
      if (!store) {
        setStatus("El almacenamiento local no está disponible en este navegador.", false);
        return undefined;
      }
      try {
        const entry = store.save(currentRecord());
        setStatus(`✓ Registro guardado: ${entry.alias}`);
        return entry;
      } catch (error) {
        setStatus(error?.message || "No se pudo guardar el registro.", false);
        return undefined;
      }
    });

    actions.register("open-local-history", () => {
      renderHistory();
      go(8);
      return store?.list() || [];
    });

    actions.register("delete-local-history", ({ element }) => {
      const id = element?.dataset.historyId || "";
      if (store && id) store.remove(id);
      renderHistory();
    });

    actions.register("clear-local-history", () => {
      if (!store) return;
      if (!root.confirm("¿Borrar todos los registros del historial local de este navegador?")) return;
      store.clear();
      renderHistory();
    });

    actions.register("history-home", () => go(0));
  }

  return Object.freeze({ STORAGE_KEY, MAX_ENTRIES, createStore, normalizeEntry, mount });
});
'''
          (root / 'local-history.js').write_text(history_js, encoding='utf-8')

          store_test = r'''"use strict";

const assert = require("assert");
const history = require("../local-history.js");

function memoryStorage() {
  const data = new Map();
  return {
    getItem: (key) => data.has(key) ? data.get(key) : null,
    setItem: (key, value) => data.set(key, String(value)),
    removeItem: (key) => data.delete(key)
  };
}

{
  const storage = memoryStorage();
  let id = 0;
  const store = history.createStore(storage, {
    now: () => new Date("2026-09-14T18:00:00.000Z"),
    idFactory: () => `id-${++id}`
  });
  const saved = store.save({
    alias: "  PX-001  ", type: "seguimiento", appVersion: "r2", weightKg: 70,
    previousDose: { am: 0, pm: 20 }, recommendedDose: { am: 0, pm: 22 },
    fastingValues: [160, 170, 180], preLunchValues: [], minFasting: 160,
    note: "SEGUIMIENTO APS", rut: "12.345.678-9"
  });
  assert.equal(saved.alias, "PX-001");
  assert.equal(saved.recommendedDose.pm, 22);
  assert.equal(store.list().length, 1);
  assert.ok(!JSON.stringify(store.list()).includes("12.345.678-9"), "No debe persistir campos arbitrarios como RUT");
  store.remove(saved.id);
  assert.equal(store.list().length, 0);
}

{
  const storage = memoryStorage();
  storage.setItem(history.STORAGE_KEY, "{broken");
  const store = history.createStore(storage);
  assert.deepEqual(store.list(), []);
}

{
  const storage = memoryStorage();
  let id = 0;
  const store = history.createStore(storage, { idFactory: () => `x-${++id}` });
  for (let i = 0; i < history.MAX_ENTRIES + 5; i += 1) store.save({ alias: `PX-${i}`, note: "x" });
  assert.equal(store.list().length, history.MAX_ENTRIES);
  store.clear();
  assert.equal(store.list().length, 0);
}

console.log("Local history store checks passed");
'''
          (root / 'tests/history-store.test.js').write_text(store_test, encoding='utf-8')

          e2e_test = r'''const { test, expect } = require("@playwright/test");

async function openFollowup(page) {
  await page.goto("/");
  await page.locator("#p0").getByRole("button", { name: "INICIAR ALGORITMO", exact: true }).click();
  await page.locator("#p1").getByRole("button", { name: "NO", exact: true }).click();
  await page.locator("#p2").getByRole("button", { name: "SEGUIMIENTO DE INSULINA", exact: true }).click();
  await page.locator("#p35").getByRole("button", { name: "CONTINUAR AL REGISTRO DE GLICEMIAS", exact: true }).click();
}

async function fillValues(locator, values) {
  for (let index = 0; index < values.length; index += 1) await locator.nth(index).fill(String(values[index]));
}

test("el historial local sólo guarda por acción explícita y persiste tras recargar", async ({ page }) => {
  await openFollowup(page);
  await page.locator("#peso-seguimiento").fill("70");
  await page.locator("#tipo-esquema").selectOption("pm");
  await page.locator("#pm-actual").fill("20");
  await fillValues(page.locator("#tabla-seguimiento .ay"), [160, 170, 180]);
  await page.locator("#ajustar-seguimiento-btn").click();
  await expect(page.locator("#p5")).toHaveClass(/active/);

  expect(await page.evaluate(() => localStorage.getItem("insulog.history.v1"))).toBeNull();
  await page.locator("#historial-alias").fill("PX-001");
  await page.getByRole("button", { name: "GUARDAR EN HISTORIAL LOCAL", exact: true }).click();
  await expect(page.locator("#historial-local-status")).toContainText("PX-001");

  const stored = await page.evaluate(() => JSON.parse(localStorage.getItem("insulog.history.v1") || "[]"));
  expect(stored).toHaveLength(1);
  expect(stored[0].alias).toBe("PX-001");
  expect(stored[0].previousDose.pm).toBe(20);
  expect(stored[0].recommendedDose.pm).toBe(22);
  expect(stored[0].fastingValues).toEqual([160, 170, 180]);

  await page.reload();
  await page.getByRole("button", { name: "HISTORIAL LOCAL", exact: true }).click();
  await expect(page.locator("#p8")).toHaveClass(/active/);
  await expect(page.locator("#historial-local-lista")).toContainText("PX-001");
  await expect(page.locator("#historial-local-lista")).toContainText("PM 20 UI");
  await expect(page.locator("#historial-local-lista")).toContainText("PM 22 UI");
});

test("el historial local permite eliminar registros", async ({ page }) => {
  await page.goto("/");
  await page.evaluate(() => localStorage.setItem("insulog.history.v1", JSON.stringify([{
    id: "one", savedAt: "2026-09-14T18:00:00.000Z", alias: "PX-DEL", type: "seguimiento",
    previousDose: { am: 0, pm: 10 }, recommendedDose: { am: 0, pm: 12 }, note: "SEGUIMIENTO APS"
  }])));
  await page.reload();
  await page.getByRole("button", { name: "HISTORIAL LOCAL", exact: true }).click();
  await expect(page.locator("#historial-local-lista")).toContainText("PX-DEL");
  await page.getByRole("button", { name: "ELIMINAR REGISTRO", exact: true }).click();
  await expect(page.locator("#historial-local-lista")).toContainText("No hay registros guardados");
});
'''
          (root / 'tests/e2e/local-history.spec.js').write_text(e2e_test, encoding='utf-8')

          # index: load local history after app adapters but before the delegated shell.
          path = root / 'index.html'
          text = path.read_text(encoding='utf-8')
          marker = '  <script src="./document-flow.js?v='
          idx = text.find(marker)
          if idx == -1:
              raise SystemExit('index script marker not found')
          end = text.find('</script>', idx) + len('</script>')
          if './local-history.js?v=' not in text:
              token = re.search(r'\?v=([A-Za-z0-9._-]+)', text[idx:end]).group(1)
              text = text[:end] + f'\n  <script src="./local-history.js?v={token}"></script>' + text[end:]
          path.write_text(text, encoding='utf-8')

          # release manifest: local-history participates in atomic PWA release.
          path = root / 'scripts/app_shell_release.py'
          text = path.read_text(encoding='utf-8')
          if '"local-history.js",' not in text:
              text = text.replace('    "document-flow.js",\n    "app-shell.js",', '    "document-flow.js",\n    "local-history.js",\n    "app-shell.js",', 1)
          path.write_text(text, encoding='utf-8')

          # service worker precache.
          path = root / 'sw.js'
          text = path.read_text(encoding='utf-8')
          if './local-history.js?v=' not in text:
              match = re.search(r'  "\./document-flow\.js\?v=([A-Za-z0-9._-]+)",', text)
              if not match:
                  raise SystemExit('sw document-flow marker not found')
              token = match.group(1)
              text = text.replace(match.group(0), match.group(0) + f'\n  "./local-history.js?v={token}",', 1)
          path.write_text(text, encoding='utf-8')

          # package: future verify runs always cover local persistence.
          path = root / 'package.json'
          package = json.loads(path.read_text(encoding='utf-8'))
          scripts = package['scripts']
          scripts['test:local-history'] = 'node tests/history-store.test.js'
          scripts['verify'] = scripts['verify'].replace('npm run test:note-presenter &&', 'npm run test:note-presenter && npm run test:local-history &&')
          path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # static CI: syntax + unit test.
          path = root / '.github/workflows/static-check.yml'
          text = path.read_text(encoding='utf-8')
          if 'node --check local-history.js' not in text:
              text = text.replace('          node --check document-flow.js\n', '          node --check document-flow.js\n          node --check local-history.js\n', 1)
          if 'node --check tests/history-store.test.js' not in text:
              text = text.replace('          node --check tests/note-presenter.test.js\n', '          node --check tests/note-presenter.test.js\n          node --check tests/history-store.test.js\n', 1)
          if 'Run local history store tests' not in text:
              text = text.replace('      - name: Validate manifest JSON\n', '      - name: Run local history store tests\n        run: npm run test:local-history\n\n      - name: Validate manifest JSON\n', 1)
          path.write_text(text, encoding='utf-8')

          # Basic source guardrails.
          assert 'localStorage' in (root / 'local-history.js').read_text(encoding='utf-8')
          assert 'rut' not in (root / 'local-history.js').read_text(encoding='utf-8').lower()
          assert './local-history.js?v=' in (root / 'index.html').read_text(encoding='utf-8')
          assert './local-history.js?v=' in (root / 'sw.js').read_text(encoding='utf-8')
          PY

      - name: Install dependencies and browsers
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      - name: Regenerate canonical PWA release
        run: npm run release:write

      - name: Refresh visual baselines for the intentional home UI change
        run: |
          set -o pipefail
          VISUAL_RECORD=1 npx playwright test tests/e2e/visual-contract.spec.js --project=chromium | tee /tmp/visual-record.log
          python - <<'PY'
          from pathlib import Path
          import json, re
          path = Path('tests/e2e/visual-baseline.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          hashes = dict(re.findall(r'VISUAL_BASELINE\s+(\S+)\s+([0-9a-f]{16})', Path('/tmp/visual-record.log').read_text(encoding='utf-8')))
          expected = set(data['profiles'])
          if set(hashes) != expected:
              raise SystemExit(f'Visual record incomplete: got {sorted(hashes)}, expected {sorted(expected)}')
          data['version'] = 'local-history-v1-20260914'
          for key, value in hashes.items():
              data['profiles'][key]['hash'] = value
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Full verification
        run: npm run verify

      - name: Commit verified local history and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-history.js tests/history-store.test.js tests/e2e/local-history.spec.js tests/e2e/visual-baseline.json index.html sw.js pdf-preview.html scripts/app_shell_release.py package.json .github/workflows/static-check.yml
          git rm .github/workflows/add-local-history-once.yml
          git commit -m "Feat: historial longitudinal local sin servidor"
          git push
