name: Diagnose Farmacia Popular search
on:
  push:
    branches: [fix-pharmacy-search-filter]
    paths:
      - "scripts/diagnose_farmacia_search.py"
      - ".github/workflows/diagnose-farmacia-search.yml"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python scripts/diagnose_farmacia_search.py
