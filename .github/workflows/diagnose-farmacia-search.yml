name: Test Farmacia Popular filtered sync
on:
  push:
    branches: [fix-pharmacy-search-filter]
    paths:
      - "scripts/update_farmacia_cerro_navia.py"
      - "farmacia-popular.js"
      - ".github/workflows/diagnose-farmacia-search.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python -m py_compile scripts/update_farmacia_cerro_navia.py
      - run: node --check farmacia-popular.js
      - name: Run real Cerro Navia filtered search
        run: |
          python scripts/update_farmacia_cerro_navia.py
          cat data/farmacia-cerro-navia.json
