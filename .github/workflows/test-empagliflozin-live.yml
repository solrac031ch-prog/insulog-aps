name: Test empagliflozin live pharmacy results
on:
  push:
    branches: [fix-empagliflozin-and-850]
    paths:
      - ".github/workflows/test-empagliflozin-live.yml"
      - "scripts/update_farmacia_cerro_navia.py"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Query Cerro Navia and validate empagliflozin products
        run: |
          python scripts/update_farmacia_cerro_navia.py
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/farmacia-cerro-navia.json').read_text(encoding='utf-8'))
          empa = data['medications']['empagliflozina']['matches']
          combo = data['medications']['empaMet12_5_1000']['matches']
          empa_variants = {x['variant'] for x in empa}
          combo_variants = {x['variant'] for x in combo}
          products = [x['product'] for x in empa + combo]
          print('query_rows=', data.get('query_rows'))
          print('empagliflozina=', empa)
          print('combinaciones=', combo)
          assert {'10', '25'} <= empa_variants, empa_variants
          assert {'12.5/850', '12.5/1000'} <= combo_variants, combo_variants
          assert any('JARDIANCE 10' in x for x in products), products
          assert any('JARDIANCE 25' in x for x in products), products
          assert any('12,5/850' in x for x in products), products
          assert any('12,5/1000' in x for x in products), products
          PY
