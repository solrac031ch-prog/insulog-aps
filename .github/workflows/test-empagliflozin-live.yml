name: Test empagliflozin live pharmacy results
on:
  push:
    branches: [fix-empagliflozin-and-850]
    paths:
      - ".github/workflows/test-empagliflozin-live.yml"
      - "scripts/update_farmacia_cerro_navia.py"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect raw empag search rows
        run: |
          python - <<'PY'
          import runpy
          import requests
          ns = runpy.run_path('scripts/update_farmacia_cerro_navia.py')
          session = requests.Session()
          session.headers.update(ns['HTTP_HEADERS'])
          initial = session.get(ns['SOURCE_URL'], timeout=45)
          initial.raise_for_status()
          headers, rows = ns['query_filtered_rows'](session, 'empag')
          print('HEADERS=', headers)
          for i, row in enumerate(rows, 1):
              print('ROW', i, repr(row))
              print('  empag_match=', ns['is_match']('empagliflozina', row))
              print('  combo_match=', ns['is_match']('empaMet12_5_1000', row))
          PY
